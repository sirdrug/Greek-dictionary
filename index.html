<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Словарик по урокам</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--p:#5B2A6E;--g:#8A8A8A;--d:#313131;--ours:#7A6E86;--bg:#fff;--line:#ece7ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--d);
     font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
       padding:10px 14px 8px;z-index:5}
h1{margin:0 0 8px;font-size:19px;color:var(--p)}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
   font-size:16px;outline:none}
#q:focus{border-color:var(--p)}
.hint{color:var(--g);font-size:12px;margin:6px 2px 0}
main{padding:0 14px 40px}
.les{margin:16px 0 6px;background:var(--p);color:#fff;border-radius:7px;padding:7px 10px;
     cursor:pointer;scroll-margin-top:96px}
.e{cursor:pointer}
.les b{display:block;font-size:15px}
.les span{display:block;font-size:11.5px;color:#D9CDE0;margin-top:2px}
.e{padding:5px 2px;border-bottom:1px solid var(--line)}
.w{color:var(--p);font-weight:700}
.tr{color:var(--g);font-size:14px}
.ru{color:var(--d)}
.ours{color:var(--ours)}
.sub{color:var(--p);font-weight:700;font-size:14px;margin:12px 2px 2px}
.none{color:var(--g);padding:18px 2px}
footer{color:var(--g);font-size:12px;padding:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Словарик по урокам</h1>
  <input id="q" placeholder="поиск: слово, «урок 7» или цифра" autocomplete="off">
  <!-- Третье предложение шапки снято 20.10 по наряду; довод — в README, где
       перечислено снятое. Здесь его нет нарочно: страница уезжает к человеку,
       записки остаются в репозитории.
       Цвет оставлен: оттенок — это вид, а не утверждение. -->
  <div class="hint">Нажмите на слово или плашку — перейдёте к разделу целиком.
  Цифра показывает раздел чисел.</div>
</header>
<main id="out"></main>
<footer id="foot"></footer>
<!-- СТРАНИЦА НАЗЫВАЕТ СЕБЯ, и это отдельная строка, а не часть «найдено».

     Наряд pm по живому случаю (23.10): человек открыл словарик из телеграма и
     не увидел урока 15, хотя всё уехало. Сайт отдавал новое (72 037 б, разделов
     16), но у гитхаба max-age=600, а у телеграма свой кэш — и мы с ним ГАДАЛИ,
     кэш это или дефект. Прибор, который не называет себя, заставляет гадать о
     предмете; у нас это сегодня стоило кругов пять раз.

     Поэтому строка берёт числа ИЗ ЗАГРУЖЕННОГО ФАЙЛА, а не из нашей веры: имя
     версии, если служба его положила, длину полученного и время с заголовка
     ответа. -->
<footer id="self"></footer>
<script>
const out=document.getElementById('out'), q=document.getElementById('q'),
      foot=document.getElementById('foot'),
      меня=document.getElementById('self');
let data=null;
try{ if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();} }catch(e){}
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Разметка ПО КЛАССУ ЗНАКА: греческий кусок — фиолетовым полужирным,
// [в скобках] — серым, прочее — тёмным. Так подсвечены ВСЕ строки,
// а не только те, что разобрались на слово+транскрипцию.
const GREEK=/[\u0370-\u03FF\u1F00-\u1FFF][\u0370-\u03FF\u1F00-\u1FFF\s,·]*|\[[^\]]*\]/g;
function byClass(t){
  let out='',last=0,m;
  GREEK.lastIndex=0;
  while((m=GREEK.exec(t))!==null){
    if(m.index>last) out+='<span class="ru">'+esc(t.slice(last,m.index))+'</span>';
    out+= m[0][0]==='[' ? '<span class="tr">'+esc(m[0])+'</span>'
                        : '<span class="w">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  if(last<t.length) out+='<span class="ru">'+esc(t.slice(last))+'</span>';
  return out;
}
function entry(e,li){
  const d=' data-l="'+li+'"';
  if(e.head) return '<div class="sub"'+d+'>'+esc(e.ru)+'</div>';
  if(e.raw||e.pair) return '<div class="e"'+d+'>'+byClass(e.ru)+'</div>';
  const ourTr=(e.ours||[]).includes('tr'), ourRu=(e.ours||[]).includes('ru');
  let h='<div class="e"'+d+'><span class="w">'+esc(e.w)+'</span>';
  if(e.tr) h+=' <span class="tr'+(ourTr?' ours':'')+'">['+esc(e.tr)+']</span>';
  // Цифру рисует ПОТРЕБИТЕЛЬ: в данных она одним полем `digits`. Приписка к
  // переводу слепила бы сторожа дыры — у статьи с пустым переводом поле всё
  // равно было бы непусто (находка review-1).
  const ru=e.digits?(e.digits+' — '+(e.ru||'')):e.ru;
  if(ru) h+=' <span class="'+(ourRu?'ours':'ru')+'">— '+esc(ru)+'</span>';
  return h+'</div>';
}
// Поиск ищет И по урокам: совпал номер, греческое название или перевод
// названия — урок показывается ЦЕЛИКОМ. Иначе «урок 7» не находило ничего,
// потому что слова «урок» нет ни в одной статье.
// РАЗДЕЛ ОПОЗНАЁТСЯ ПО СТРОЕНИЮ, А НЕ ПО ИМЕНИ (форма dev-1): страница обходит
// `sections` и не знает, сколько их и как они зовутся. Есть `num` — урок; нет —
// раздел без номера (числа), и плашка пишет только название: «Урок undefined»
// было бы хуже отсутствия номера.
const barText=S=>S.num?('Урок '+S.num+' · '+(S.title||'')):(S.title||'');
// ЧИСТАЯ ЦИФРА ПОКАЗЫВАЕТ РАЗДЕЛ ЦЕЛИКОМ, и так просил человек: «цифры просто в
// поиске как цифры должны показывать раздел». Поэтому «347», которого в опорных
// нет, выводит раздел чисел, а не «такого слова нет»: второе утверждало бы о
// словаре то, чего в нём не смотрели.
const hasDigits=S=>(S.entries||[]).some(e=>e.digits);
function sectionHit(S,f){
  if(!f) return false;
  if(/^[0-9]+$/.test(f)&&hasDigits(S)) return true;
  if(S.num){
    const num=('урок '+S.num+' '+S.num).toLowerCase();
    if(num.includes(f)||f.includes('урок '+S.num)) return true;
  }
  return (S.title||'').toLowerCase().includes(f)
       ||(S.title_ru||'').toLowerCase().includes(f)
       // Строка о составе тоже ищется: «составные» и «буквосочетания» — слова,
       // которыми человек спросит про то, чего в разделе НЕТ.
       ||(S.about||'').toLowerCase().includes(f);
}
function render(filter){
  const f=(filter||'').trim().toLowerCase();
  const secs=data.sections||[];
  let html='', shownE=0, shownS=0;
  secs.forEach((S,i)=>{
    const all=S.entries||[];
    const whole=sectionHit(S,f);
    const es=whole?all
                  :all.filter(e=>!f||((e.w+' '+e.tr+' '+e.ru+' '+(e.digits||''))
                                      .toLowerCase().includes(f)));
    if(!es.length) return;
    shownE+=es.length; shownS++;
    html+='<div class="les" id="sec'+i+'" data-l="'+i+'">'+
          '<b>'+esc(barText(S))+'</b>'+
          (S.title_ru?'<span>'+esc(S.title_ru)+'</span>':'')+'</div>';
    // Строка о составе — СВОЙСТВО раздела, а не статья в нём: один носитель на
    // страницу, бумагу и бота (просьба dev-1). Рисуется там же, где стояла
    // прежним пояснением — первой, до статей.
    if(S.about) html+='<div class="sub" data-l="'+i+'">'+esc(S.about)+'</div>';
    html+=es.map(e=>entry(e,i)).join('');
  });
  // ПУСТО ПРИ ПУСТОМ ПОИСКЕ — ЭТО НЕ «СЛОВА НЕТ», А «ЧИТАТЬ НЕЧЕГО».
  //
  // Замечание review-1: если разделы на месте, а статьи лежат под другим
  // именем (`entries` -> `items` — тот же род, что `lessons` -> `sections`
  // 19.10), `render` НЕ падает, а рисует пустоту, и страница говорит «такого
  // слова в словаре нет» о словаре, которого не прочла. Отличить одно от
  // другого можно без всякого знания формы: при ПУСТОМ запросе пустой вывод
  // означает, что статей нет вовсе.
  out.innerHTML=html||('<div class="none">'+esc(f
      ? 'Такого слова в словаре нет.'
      : 'Словарь загружен, но статей в нём не видно — читать нечего. Дело в '+
        'данных, а не в вашем запросе.')+'</div>');
  // УРОКИ — ТОЛЬКО РАЗДЕЛЫ ДОКУМЕНТА: `num` есть и у НАШИХ разделов (у азбуки
  // он «1»), поэтому счёт по одному `num` давал 15 там, где у службы и в
  // карточке 14 (находка review-1 на живой версии dict-20261023-165844.json).
  // Два числа об одном предмете на одной версии — хуже, чем ни одного: человек
  // сверяет страницу с карточкой и решает, что где-то потеря.
  const les=secs.filter(S=>S.num&&!S.by_us).length;
  // «РАЗДЕЛОВ» ЗНАЧИЛО У НАС ДВА РАЗНЫХ ЧИСЛА (замечание test-1 через pm,
  // 23.10): страница писала «разделов: 2», имея в виду НАШИ разделы, а карточка
  // бота — «разделов 16 (наших 2)», имея в виду все. Человек, сверяя два наших
  // же сообщения на одной версии, видел расхождение там, где его нет.
  //
  // Поэтому здесь слово называет предмет целиком: «наших разделов». В поиске
  // «разделов» остаётся общим счётом найденного — там предмет другой, и он
  // назван словом «Найдено».
  foot.textContent=f?('Найдено: разделов '+shownS+' · статей '+shownE)
                   :('Уроков: '+les+(secs.length>les?' · наших разделов: '+(secs.length-les):'')+
                     ' · статей: '+secs.reduce((n,S)=>n+(S.entries||[]).length,0));
}
// Нажатие на слово или на плашку: снять поиск, показать всё и перейти
// к этому уроку — чтобы видеть его целиком, а не одну найденную строку.
function goto(i){
  // Якорь по НОМЕРУ В СПИСКЕ, а не по номеру урока: у раздела чисел номера нет,
  // и `les'+undefined` увело бы в никуда. Индекс при поиске не меняется — обход
  // идёт по полному списку, отсеиваются только пустые.
  q.value=''; render('');
  const el=document.getElementById('sec'+i);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
out.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-l]');
  if(t) goto(+t.getAttribute('data-l'));
});
// ОТКАЗ НАЗЫВАЕТ ТО, ЧТО ИЗВЕСТНО, И НЕ БОЛЬШЕ (наряд pm 20.10).
//
// Было: любая беда печатала «Не удалось загрузить словарь» — и загрузка, и
// разбор, и отрисовка. Замерено на странице, лежавшей у человека до 19:48:
// данные приходили ЦЕЛЫМИ, падала отрисовка (`data.lessons.forEach` на новой
// форме), а человек читал «не удалось загрузить» и шёл смотреть, не сломали ли
// мы ему словарь. То есть прибор страницы говорил о СЕБЕ, а читалось как
// утверждение о ПРЕДМЕТЕ.
//
// Три исхода различимы, и каждый говорит своё:
//
//	не доехал файл          сеть, 404, не тот тип — про это знаем точно
//	доехал, но без разделов  то же, что отказ бота: «ни одного раздела».
//	                         Молчать нельзя — пустой обход нарисовал бы
//	                         «Такого слова в словаре нет», то есть соврал
//	                         бы о словаре, которого не прочёл
//	доехал, не нарисовался   говорим ровно это и даём ход («обновите»),
//	                         НЕ называя причину: страница не может отличить
//	                         свою старость от беды в данных
//
// Старую страницу в кеше человека это не чинит — она уже у него. Чинит
// следующую: её отказ больше не врёт.
function say(text){ out.innerHTML='<div class="none">'+esc(text)+'</div>'; }
// ЧЕТЫРЕ ИСХОДА, И КАЖДЫЙ ГОВОРИТ ТО, ЧТО ИЗВЕСТНО (наряд pm, возврат review-1).
//
//	не доехал файл      сеть, 404 — знаем точно
//	доехал, не разобран  ФАЙЛ ЕСТЬ. Первая редакция говорила тут «не
//	                     получен», и человек шёл проверять сеть вместо
//	                     данных — та же беда, что заход чинит, только
//	                     причина названа не та (находка review-1). Вход не
//	                     выдуманный: у нас сегодня build.py при полном
//	                     диске записал НУЛЕВОЙ pdf; нулевой dict.json
//	                     появится тем же путём
//	доехал, без разделов как отказ бота: «ни одного раздела»
//	доехал, не нарисован говорим ровно это и даём ход, причину НЕ называем
//
// `r.text()` вместо `r.json()` нарочно: разбор отделён от получения, и в
// сообщение попадает ДЛИНА полученного — «0 байт» само называет беду.
fetch('dict.json?'+Date.now()).then(
  r=>{
    if(!r.ok){ say('Не удалось загрузить словарь: файл dict.json не получен (HTTP '+r.status+').'); return; }
    var lastMod=r.headers&&r.headers.get?r.headers.get('last-modified'):null;
    return r.text().then(t=>{
      var d;
      try{ d=JSON.parse(t); }
      catch(e){
        say('Словарь получен ('+t.length+' байт), но не разобрался: '+e.message+
            '. Дело в самом файле, а не в связи.');
        return;
      }
      if(!d || !Array.isArray(d.sections) || !d.sections.length){
        say('Словарь загружен, но разделов в нём нет. Это не «слова нет» — '+
            'читать нечего, и дело в данных, а не в вашем запросе.');
        return;
      }
      data=d;
      // ВЕРСИЯ НАЗЫВАЕТСЯ ТОЛЬКО ЕСЛИ ОНА ЕСТЬ В ДАННЫХ.
      //
      // Поля `version` в dict.json сегодня нет — служба кладёт его в
      // предложение, а не в данные. Выдумать имя версии по дате загрузки
      // значило бы показать человеку число, которого в файле нет; поэтому
      // здесь «версия в данных не названа», а рядом — то, что ИЗМЕРЕНО:
      // длина полученного и время с заголовка ответа сервера.
      var ver=(d&&d.version)?('версия '+d.version):'версия в данных не названа',
          // Та же мерка, что ниже в подвале: уроки — разделы ДОКУМЕНТА.
          уроков=(d.sections||[]).filter(S=>S.num&&!S.by_us).length,
          статей=(d.sections||[]).reduce((n,S)=>n+(S.entries||[]).length,0);
      // БАЙТЫ СЧИТАЮТСЯ БАЙТАМИ, А НЕ ЗНАКАМИ, и это моя же пойманная ошибка:
      // первая редакция писала «55 434 байт» для файла в 68 684 байта —
      // `t.length` в браузере это знаки UTF-16, а греческий и кириллица
      // занимают по два байта. Прибор назвал бы человеку число, которое не
      // сходится с размером файла, и он пошёл бы искать беду в данных.
      //
      // Если TextEncoder почему-то недоступен — говорим «знаков», то есть ровно
      // то, что измерено. Единица рядом с числом обязана называть мерку.
      var объём;
      try{ объём=new TextEncoder().encode(t).length+' байт'; }
      catch(e){ объём=t.length+' знаков'; }
      меня.textContent='Загружено: '+ver+' · уроков '+уроков+' · статей '+статей+
        ' · '+объём+(lastMod?(' · с сервера '+lastMod):'');
      try{ render(''); }
      catch(e){
        say('Словарь загружен, но эта страница его не прочитала. Если она '+
            'давно открыта — обновите её; если не поможет, дело в странице, '+
            'а не в словаре.');
      }
    });
  },
  e=>{ say('Не удалось загрузить словарь: файл dict.json не получен ('+(e&&e.message||e)+').'); }
);
q.addEventListener('input',()=>render(q.value));
</script>
</body>
</html>
