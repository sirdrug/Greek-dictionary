<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Словарик по урокам</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--p:#5B2A6E;--g:#8A8A8A;--d:#313131;--ours:#7A6E86;--bg:#fff;--line:#ece7ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--d);
     font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
       padding:10px 14px 8px;z-index:5}
h1{margin:0 0 8px;font-size:19px;color:var(--p)}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
   font-size:16px;outline:none}
#q:focus{border-color:var(--p)}
.hint{color:var(--g);font-size:12px;margin:6px 2px 0}
main{padding:0 14px 40px}
.les{margin:16px 0 6px;background:var(--p);color:#fff;border-radius:7px;padding:7px 10px;
     cursor:pointer;scroll-margin-top:96px}
.e{cursor:pointer}
.les b{display:block;font-size:15px}
.les span{display:block;font-size:11.5px;color:#D9CDE0;margin-top:2px}
.e{padding:5px 2px;border-bottom:1px solid var(--line)}
.w{color:var(--p);font-weight:700}
.tr{color:var(--g);font-size:14px}
.ru{color:var(--d)}
.ours{color:var(--ours)}
.sub{color:var(--p);font-weight:700;font-size:14px;margin:12px 2px 2px;scroll-margin-top:96px}
.jump{margin:6px 2px 2px;font-size:14px}
.jump a{color:var(--p);text-decoration:none;border-bottom:1px dotted var(--p)}
.conj{margin:3px 0 1px;font-size:14px}
.conj span{color:var(--d)}
.conjhead{color:var(--g);font-size:12px;margin:2px 0 3px}
.conjt{border-collapse:collapse;margin:2px 0 4px;font-size:14px}
.conjt td{padding:1px 8px 1px 0;vertical-align:baseline}
.stem{color:var(--g)}
.end{color:var(--p);font-weight:700}
.none{color:var(--g);padding:18px 2px}
.tabs{display:flex;gap:8px;padding:8px 14px 0}
.tab{border:1px solid var(--line);background:var(--bg);color:var(--g);
     border-radius:9px;padding:7px 14px;font-size:14px;cursor:pointer}
.tab.on{color:var(--p);border-color:var(--p);font-weight:700}
.card{padding:14px 2px}
.ask{font-size:26px;margin:6px 0 2px}
.trans{font-size:15px;margin:0 0 6px}
.full{font-size:13.5px;margin:0 0 8px;color:var(--ours)}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);
     color:var(--d);border-radius:9px;padding:11px 12px;font-size:16px;cursor:pointer}
.opt.good{border-color:#2E7D32;background:#EAF5EA;color:#1B5E20;font-weight:700}
.opt.bad{border-color:#C62828;background:#FBEAEA;color:#B71C1C}
.next{margin-top:4px;border:1px solid var(--p);background:var(--p);color:#fff;
      border-radius:9px;padding:10px 16px;font-size:15px;cursor:pointer}
/* ЭКЗАМЕН: ВИД — ПОДОБИЕ ОДОБРЕННОГО ЛИСТА (второй, сине-стальной).
   Человек сказал «Новый вид очень нравицо» (05.11, через pm) о КОНКРЕТНОМ файле;
   он лежит рядом как samples/exam_look_approved.html и правке не подлежит.
   Прежний кремовый вид одобрен больше ничем — про него человек сказал «не как в
   учебнике оригинале», и это решение теперь не моё.
   Опознавательных знаков Центра и министерства нет ни одного.
   Переносы держит CSS (white-space:pre-line), а не теги: два носителя одного
   переноса расходятся молча. */
#exam{--blue:#2e6ca4;--blue2:#4a7fb5;--deep:#1f4f7d;--eline:#9fbdd8;--fill:#e6eef7;
      --green:#7aa83f;--gfill:#eef5e2;--gline:#b6cf92;--orange:#e07b22;--egrey:#7b8794;
      /* ВЫЛЕТ ЗА ОКНО СНЯТ (находка test-1 на #532): #exam — это сам <main>,
         и «margin:0 -14px» поверх «main{padding:0 14px}» делал элемент на 28 px
         шире окна; на телефоне правый столбец подрезало краем. Своё поле main-а
         обнуляем, а отрицательного не нужно вовсе: блок и так во всю ширину. */
      background:#dfe6ee;margin:0;padding:0 0 18px;color:#17202a;max-width:100%;
      font:14.5px/1.55 Arial,"Liberation Sans",Helvetica,sans-serif}
#exam .page{max-width:840px;margin:16px auto 22px;background:#fff;position:relative;
      box-shadow:0 6px 26px rgba(23,45,70,.18)}
#exam .band{height:46px;position:relative;
      background:linear-gradient(90deg,#7e9ec4 0%,#4a6f9c 46%,#2b4e78 100%)}
#exam .band:after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;
      background:linear-gradient(90deg,#e8a06a,#c9b3d6 40%,#9fc3dd 70%,#cfe0ee)}
#exam .band .lvl{position:absolute;right:26px;top:7px;color:#fff;font-size:26px;
      letter-spacing:.06em;font-weight:700;opacity:.95}
#exam .band .lvl i{font-size:15px;font-style:normal;vertical-align:-2px}
#exam .rail{position:absolute;left:0;top:46px;bottom:0;width:46px;
      background:linear-gradient(180deg,#eaf1f8,#cfe0ee 55%,#eef4fa)}
#exam .rail em{position:absolute;left:13px;top:46%;width:20px;height:20px;border-radius:50%;
      background:#8fb0cf;color:#fff;font-style:normal;font-size:10px;text-align:center;
      line-height:20px}
#exam .rail span{position:absolute;top:44px;left:-16px;width:78px;text-align:center;
      transform:rotate(-90deg);font-size:9px;letter-spacing:.3em;color:#6d8aa6}
#exam .inner{padding:26px 40px 34px 70px}
#exam .cover{padding:52px 0 70px;text-align:center}
#exam .cover .big{color:var(--blue);font-size:30px;letter-spacing:.18em;line-height:1.5;
      font-weight:700}
#exam .cover .units{margin-top:34px;display:inline-block;background:#cfe0a8;color:#fff;
      font-size:26px;letter-spacing:.08em;font-weight:700;padding:18px 26px;border-radius:4px}
#exam .cover .dur{margin-top:26px;color:var(--blue);font-size:12px;letter-spacing:.24em}
#exam .cover .pass{margin-top:10px;color:var(--egrey);font-size:12.5px;letter-spacing:.04em}
#exam .cover .pass b{color:var(--deep)}
#exam .cover .who{margin:26px auto 0;max-width:460px;color:var(--egrey);font-size:12px;
      line-height:1.6}
#exam .skill{color:var(--blue);font-size:13px;letter-spacing:.3em;font-weight:700}
#exam .pnum{color:var(--deep);font-size:12px;letter-spacing:.26em;font-weight:700;margin-top:12px}
#exam .pnum span{color:var(--egrey);letter-spacing:.12em;font-weight:400}
#exam .rubric{margin:14px 0 0;max-width:720px}
#exam .rubric .el{margin:0;text-align:justify;font-size:13.5px}
#exam .rubric .el::first-letter{float:left;font-size:40px;line-height:.86;padding:2px 9px 0 0;
      color:#9cc0de;font-weight:700}
#exam .rubric .ru{margin:8px 0 0;color:var(--egrey);font-size:12.5px;font-style:italic}
#exam .notice{display:flex;justify-content:flex-end;gap:12px;margin:16px 0 20px}
#exam .notice .lbl{color:var(--blue);font-weight:700;font-size:11px;letter-spacing:.14em;
      padding-top:2px}
#exam .notice .txt{border-left:1px solid var(--eline);padding-left:12px;max-width:330px;
      color:var(--blue2);font-size:12px;text-align:justify}
#exam .ads{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;margin:6px 0 26px}
#exam .ad{display:flex;align-items:stretch}
#exam .ad .tab{width:26px;border-radius:7px 0 0 7px;color:#fff;font-weight:700;font-size:15px;
      display:flex;align-items:center;justify-content:center;
      background:linear-gradient(180deg,#6f97c2,#4a7097)}
#exam .ad .card{flex:1;border:1px solid var(--eline);border-left:0;border-radius:0 9px 9px 0;
      padding:11px 14px;font-size:12.8px;text-align:center;line-height:1.5;white-space:pre-line}
#exam .ad.ex .tab{background:linear-gradient(180deg,#a6cd77,#7aa83f)}
#exam .ad.ex .card{border-color:var(--gline)}
#exam .tfhead{display:flex;justify-content:flex-end;gap:6px;margin-bottom:5px}
#exam .tfhead div{width:92px;text-align:center;color:#fff;font-size:10.5px;letter-spacing:.16em;
      padding:4px 0;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#6f97c2,#4a7097)}
#exam .tfrow{display:flex;align-items:stretch;gap:6px;margin-bottom:6px}
#exam .tfrow .num{width:34px;border:1px solid var(--eline);border-radius:6px;display:flex;
      align-items:center;justify-content:center;font-weight:700;color:var(--deep)}
#exam .tfrow .stripe{width:5px;border-radius:3px}
#exam .tfrow .stripe.s1{background:#e79ab4}
#exam .tfrow .stripe.s2{background:#a6cd77}
#exam .tfrow .claim{flex:1;border:1px solid var(--eline);border-radius:6px;padding:9px 12px;
      font-size:12.8px;display:flex;align-items:center}
#exam .tfrow .ans{width:92px;padding-bottom:9px;min-height:42px;border:1px solid var(--eline);
      border-radius:6px;background:var(--fill);position:relative;display:flex;
      align-items:center;justify-content:center;cursor:pointer}
#exam .tfrow.ex .claim{background:#f4f8fc}
#exam .tfrow.ex .ans{cursor:default}
#exam .ans.pick{background:#cfe0a8}
#exam .tick{color:var(--deep);font-size:17px}
#exam .pill{position:absolute;bottom:0;left:0;right:0;background:#3d4a57;color:#fff;
      font-size:7px;letter-spacing:.12em;text-align:center;padding:2px 0}
#exam .letter{border:1px solid var(--eline);border-radius:8px;background:#fbfdff;
      padding:16px 20px;margin:6px 0 22px;font-size:13px;white-space:pre-line;line-height:1.65}
#exam .two{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
#exam .thead{color:#fff;font-size:10.5px;letter-spacing:.2em;text-align:center;padding:6px 0;
      border-radius:5px 5px 0 0;margin-bottom:6px}
#exam .thead.blue{background:linear-gradient(180deg,#6f97c2,#3f6a97)}
#exam .thead.green{background:linear-gradient(180deg,#a6cd77,#6f9c3a)}
#exam .mrow{display:flex;gap:6px;margin-bottom:6px;align-items:stretch}
#exam .mrow .num{width:52px;border:1px solid var(--eline);border-radius:6px;display:flex;
      align-items:center;justify-content:center;font-weight:700;color:var(--deep);
      position:relative;background:#f4f8fc;padding-bottom:9px;min-height:40px}
#exam .mrow .txt{flex:1;border:1px solid var(--eline);border-radius:6px;padding:9px 12px;
      font-size:12.8px;display:flex;align-items:center}
#exam .mrow .slot{width:54px;padding-bottom:9px;min-height:40px;border:1px solid var(--gline);
      border-radius:6px;background:var(--gfill);position:relative;display:flex;
      align-items:center;justify-content:center;font-weight:700;color:var(--deep);
      cursor:pointer}
#exam .mrow.ex .txt{background:#f4f8fc}
#exam .mrow.on .txt{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
#exam .mrow.pick .num,#exam .mrow .slot.pick{background:#cfe0a8}
#exam .dials{display:grid;grid-template-columns:1fr 1fr;gap:26px 28px;margin:6px 0 26px}
#exam .bubble{position:relative;border-radius:14px;padding:26px 16px 14px}
#exam .bubble.b1{background:#dde6f2}
#exam .bubble.b2{background:#e7dff0}
#exam .bubble.b3{background:#dcebcf}
#exam .bubble .dtab{position:absolute;top:-10px;left:14px;background:#8aa6c6;color:#fff;
      font-size:8.5px;letter-spacing:.16em;padding:3px 10px;border-radius:9px}
#exam .bubble.b2 .dtab{background:#a391bd}
#exam .bubble.b3 .dtab{background:#9cbb73}
#exam .bubble .body{font-size:12.6px;color:#23405c;white-space:pre-line}
#exam .bubble .tail{position:absolute;left:30px;bottom:-15px;width:30px;height:17px;
      clip-path:polygon(0 0,100% 0,14% 100%)}
#exam .bubble.b1 .tail{background:#dde6f2}
#exam .bubble.b2 .tail{background:#e7dff0}
#exam .bubble.b3 .tail{background:#dcebcf}
#exam .q{margin:0 0 15px}
#exam .qt{font-size:13.2px;font-weight:700;color:#21364b;position:relative}
#exam .qt .n{display:inline-block;width:20px;color:var(--deep)}
#exam .q.ex .qt .pill{position:static;display:inline-block;padding:2px 7px;margin-left:8px;
      border-radius:3px}
#exam .opts{list-style:none;margin:6px 0 0;padding:0 0 0 20px}
#exam .opts li{font-size:13px;padding:3px 0;display:flex;align-items:center;gap:7px}
#exam .gl{display:inline-block;width:16px;color:var(--blue);font-weight:700}
#exam .box{width:15px;height:15px;border:1px solid var(--eline);border-radius:3px;
      background:var(--fill);flex:none;padding:0;cursor:pointer}
#exam .box.pick{background:#cfe0a8;border-color:var(--green)}
#exam .gaptext{border:1px solid var(--eline);border-radius:8px;background:#fbfdff;
      padding:18px 20px;font-size:13px;line-height:2.5;margin:6px 0 22px;text-align:justify}
#exam .gap{display:inline-block;white-space:nowrap;margin:0 3px;cursor:pointer}
#exam .gap i{display:inline-block;width:34px;border-bottom:1px solid #4d6b88;vertical-align:4px}
#exam .gap b{color:var(--orange);font-size:14px;padding:0 5px}
#exam .gap.on b{background:#ffe9d2;border-radius:3px}
#exam .bank{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
#exam .bw{display:flex;gap:6px}
#exam .bw .txt{flex:1;border:1px solid var(--eline);border-radius:6px;padding:8px 12px;
      font-size:12.8px;cursor:pointer}
#exam .bw .slot{width:56px;padding-bottom:9px;min-height:36px;border:1px solid var(--gline);
      border-radius:6px;background:var(--gfill);position:relative;display:flex;
      align-items:center;justify-content:center;font-weight:700;color:var(--deep)}
#exam .bw.ex .txt{background:#f4f8fc;cursor:default}
#exam .bw .slot.pick{background:#cfe0a8}
#exam .turn{text-align:right;color:var(--blue);font-size:9.5px;letter-spacing:.2em;
      border-top:1px solid #dde6ee;margin-top:22px;padding-top:8px}
#exam .end{text-align:center;color:var(--deep);font-size:10px;letter-spacing:.16em;
      border-top:1px solid #dde6ee;margin-top:26px;padding-top:14px;line-height:1.8}
#exam .extimer{position:sticky;top:0;z-index:4;background:#2b4e78;color:#fff;
      padding:8px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;
      font-size:11px;letter-spacing:.18em;text-transform:uppercase}
#exam .extimer b{font-size:19px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
#exam .exlow b{color:#ffd0a8}
#exam .exbtn{border:1px solid #fff;background:transparent;color:#fff;padding:6px 14px;
      font:inherit;font-size:11px;letter-spacing:.14em;cursor:pointer}
#exam .exscore{max-width:840px;margin:16px auto;background:#fff;padding:18px 22px;
      box-shadow:0 6px 26px rgba(23,45,70,.18)}
#exam .exscore .big{color:var(--deep);font-size:24px;font-weight:700}
#exam .exrow{font-size:12.8px;margin:4px 0;color:#21364b}
#exam .exlab{font-size:10px;letter-spacing:.16em;color:var(--egrey)}
#exam .exgood{color:#49721f}
#exam .exbad{color:#b4472a}
#examFoot{color:#5d6b7a;font-size:12px;line-height:1.6}
@media(max-width:760px){#exam .ads,#exam .dials,#exam .bank,#exam .two{grid-template-columns:1fr}
      #exam .inner{padding:18px 14px 24px 54px}
      /* СТРОКА «ВЕРНО/НЕВЕРНО» НА ТЕЛЕФОНЕ (находка test-1 на #532): две клетки
         по 92 px оставляли утверждению 94 px, и строка вырастала до 218 px.
         Теперь утверждение занимает всю ширину, клетки уходят под него и делят
         её поровну; ярлыки ΣΩΣΤΟ/ΛΑΘΟΣ переезжают В САМИ КЛЕТКИ, потому что
         шапка над ними на этой ширине стоит не над теми столбцами. */
      #exam .tfrow{flex-wrap:wrap}
      #exam .tfrow .num{order:1}
      #exam .tfrow .stripe{order:2}
      #exam .tfrow .claim{order:3;flex:1 1 100%;margin-top:6px}
      #exam .tfrow .ans{order:4;flex:1 1 0;width:auto;min-height:38px;margin-top:6px}
      #exam .tfrow .ans:before{content:attr(data-lab);position:absolute;top:3px;left:0;
            right:0;font-size:8px;letter-spacing:.14em;color:var(--blue)}
      #exam .tfhead{display:none}
      #exam .mrow .txt,#exam .bw .txt{font-size:12px}}
footer{color:var(--g);font-size:12px;padding:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Словарик по урокам</h1>
  <input id="q" placeholder="поиск: слово, «урок 7» или цифра" autocomplete="off">
  <!-- Третье предложение шапки снято 20.10 по наряду; довод — в README, где
       перечислено снятое. Здесь его нет нарочно: страница уезжает к человеку,
       записки остаются в репозитории.
       Цвет оставлен: оттенок — это вид, а не утверждение. -->
  <div class="hint">Нажмите на слово или плашку — перейдёте к разделу целиком.
  Цифра показывает раздел чисел.</div>
</header>
<div class="tabs">
  <button id="tabDict" class="tab on">Словарь</button>
  <button id="tabTrainer" class="tab">Тренажёр</button>
  <!-- ЛИСТА НЕТ -> ВКЛАДКИ НЕТ, и это отдельная ветка в коде, а не случайная
       пустота: пустой экзамен не рисуем (условие наряда). Кнопка прячется до
       того, как лист доехал и разобрался. -->
  <button id="tabExam" class="tab" hidden>Экзамен</button>
</div>
<main id="dict"><div id="out"></div></main>
<main id="trainer" hidden><div id="trainerBox"></div></main>
<main id="exam" hidden><div id="examBox"></div></main>
<footer id="foot"></footer>
<footer id="trainerFoot"></footer>
<footer id="examFoot"></footer>
<!-- СТРАНИЦА НАЗЫВАЕТ СЕБЯ, и это отдельная строка, а не часть «найдено».

     Наряд pm по живому случаю (23.10): человек открыл словарик из телеграма и
     не увидел урока 15, хотя всё уехало. Сайт отдавал новое (72 037 б, разделов
     16), но у гитхаба max-age=600, а у телеграма свой кэш — и мы с ним ГАДАЛИ,
     кэш это или дефект. Прибор, который не называет себя, заставляет гадать о
     предмете; у нас это сегодня стоило кругов пять раз.

     Поэтому строка берёт числа ИЗ ЗАГРУЖЕННОГО ФАЙЛА, а не из нашей веры: имя
     версии, если служба его положила, длину полученного и время с заголовка
     ответа. -->
<footer id="self"></footer>
<script>
const out=document.getElementById('out'), q=document.getElementById('q'),
      foot=document.getElementById('foot'),
      trainerBox=document.getElementById('trainerBox'),
      trainerFoot=document.getElementById('trainerFoot'),
      tabDict=document.getElementById('tabDict'),
      tabTrainer=document.getElementById('tabTrainer'),
      tabExam=document.getElementById('tabExam'),
      examBox=document.getElementById('examBox'),
      examFoot=document.getElementById('examFoot'),
      меня=document.getElementById('self');
let data=null;
try{ if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();} }catch(e){}
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Разметка ПО КЛАССУ ЗНАКА: греческий кусок — фиолетовым полужирным,
// [в скобках] — серым, прочее — тёмным. Так подсвечены ВСЕ строки,
// а не только те, что разобрались на слово+транскрипцию.
const GREEK=/[\u0370-\u03FF\u1F00-\u1FFF][\u0370-\u03FF\u1F00-\u1FFF\s,·]*|\[[^\]]*\]/g;
// КОПИЯ — СТАТЬЯ, СОБРАННАЯ В НАШ РАЗДЕЛ ИЗ УРОКА, и в счёт слов она не идёт.
//
// Собирающий раздел складывает слова, НЕ вынимая их из уроков (заказ человека
// 27.10: «должны оставаться в уроках и отдельно собираться»), поэтому одно
// слово лежит в данных дважды. Посчитать их дважды значило бы сказать человеку,
// что слов стало больше, — а их столько же. Та же мерка стоит у бота
// (Dict.Originals) и обязана стоять у службы.
//
// НОСИТЕЛЬ СЧЁТА ОДИН — `copy_of`, и это решение pm от 27.10 (20:08): поле
// ставит служба и только при ДОСЛОВНОМ совпадении `w` и `ru` с уроком. Отсюда
// названная цена: собранная статья, в которой перевод при сборке подправили,
// копией уже не считается и в «статей» войдёт — то есть счёт зависит от чужой
// сборки. Второго носителя («раздел собирающий») я не завёл намеренно: два
// носителя одного предмета у нас молча расходились дважды за месяц.
function копия(e){ return !!(e&&e.copy_of); }

// своего же прибора на живых данных 27.10:
//
//	страница  «статей: 369»
//	бот       «статей 337 · строк-пометок 32» на ТОМ ЖЕ файле
//
// Разница ровно в пометках: подзаголовки урока, пары родов и вольные строки
// документа статьями не являются ни у бота, ни у сторожа, а страница считала их
// вместе со статьями. Человек, сверяя подвал страницы с карточкой бота, видел
// расхождение в 32 — и шёл искать потерю, которой нет.
//
// Теперь мерка одна на всех: статья — запись со словом и без пометки; копии
// собирающего раздела не считаются (см. `копия`). Пометки не исчезают из
// подвала, а названы своим числом: иначе падение 369 -> 337 читалось бы как
// потеря слов.
function статья_(e){
  return !!e && !e.head && !e.pair && !e.raw && !!(e.w||'').trim() && !копия(e);

// служба, имена латиницей), а за ними те, что встретились у статей, но в
// перечне не названы. Своего списка имён у страницы нет намеренно: человек
// сказал, что группы добавятся, и пятая обязана приехать одним дописыванием.
//
// Неназванная подгруппа не прячется: иначе расхождение перечня со статьями
// (правка службы, наша старая выгрузка) тихо съело бы слова.

  return out;

// из данных. Слова «Глаголы» в коде страницы нет: переименуют раздел —
// подзаголовки пойдут за ним сами.
// КЛЮЧ ПОДГРУППЫ: «A1», «а1», «a 1» — одно и то же.
//
// Человек писал имена групп русскими буквами («а1»), пока не решил «называем
// латиницей» (27.10). Двойники перечислены СПИСКОМ: кириллическая «А» и
// латинская «A» — разные знаки с одним рисунком, и никакой признак их не
// сблизит. Та же таблица и тот же довод стоят у бота (groupKey) — предмет один,
// но носителя два: у страницы и бота разные языки, и свести их в один нечем.

const имяПодгруппы=(S,g)=>((S.title_ru||S.title||'')?((S.title_ru||S.title)+' '+g):g);

// Служба пишет «μένω · я=μένω · ты=μένεις · …», сборка раскладывает это в
// `forms` и `persons` у статьи. Своего списка у страницы нет: подписать формы
// по порядку своим списком значило бы завести носитель, связанный с промптом
// заполнителя только словом (решение pm по моей же находке).

// ОБЩАЯ ЧАСТЬ ФОРМ — ТО, ЧТО У ВСЕХ ШЕСТИ ОДИНАКОВО С НАЧАЛА СЛОВА.

// Человек утвердил на макете pm форму, в которой основа и окончание видны
// ПОРОЗНЬ: «ученик должен понимать, на что меняется в глаголе окончание».
// Деление считается ИЗ САМИХ ФОРМ, а не по списку окончаний для каждой группы:
// такой список — правило греческого языка, оно живёт в промпте агента, и
// второй его носитель здесь разошёлся бы с первым молча.

// с «байтами» в подвале, только на другом конце — греческая буква с ударением

    while(i<g.length&&i<r.length&&g[i]===r[i]) i++;

// дважды): лицо · местоимение · транскрипция местоимения · форма · окончание.
//

// Поиск ищет И по урокам: совпал номер, греческое название или перевод

// pm прочитал перечень отброшенного глазами и нашёл потерю: восемь НАСТОЯЩИХ
// слов ушли вместе с мусором — у всех русский перевод есть, он просто лежит
// рядом с чужим довеском (английская подсказка автора, уровень, стрелка
// происхождения, нумерация значений, греческий пример). Ослаблять признак
// нельзя — тогда вернётся и мусор; поэтому режем ДОВЕСОК, каждое правило
// названо и померено.
//
// ОТРЕЗ ЖИВЁТ ТОЛЬКО В ТРЕНАЖЁРЕ: в словаре на той же странице статья
// показывается текстом автора целиком. Вариант ответа — не статья, и короткий
// он потому, что его читают в четырёх строках подряд.
function trainerColonOutside(t){
  // Первое двоеточие ВНЕ скобок: внутри скобки оно принадлежит пояснению
  // автора («(например: …)»), а не отделяет пример от перевода.
  let depth = 0;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(c === '(') depth++;
    else if(c === ')') depth = Math.max(0, depth - 1);
    else if(c === ':' && depth === 0) return i;
  }
  return -1;
}
function trainerTrim(ru){
  let t = String(ru || '').trim();
  // 1. Уровень или стрелка происхождения в начале: «(B2) — использовать»,
  //    «< gym – спортзал».
  t = t.replace(/^\(\s*[A-ZΑ-Ω]\d\s*\)\s*[—–-]?\s*/, '');
  // Стрелка происхождения в начале режется ДО ТИРЕ, а не до конца строки:
  // «< gym – спортзал» -> «спортзал». Первая редакция ела всё («[^>]*» без
  // закрывающей скобки), и слово исчезало целиком — поймано плечом.
  t = t.replace(/^<\s*[^>\u2014\u2013-]*[>\u2014\u2013-]\s*/, '');
  // 2. Стрелка происхождения в хвосте: «скажи-ка! (не скажешь ли) < глагол λέω».
  const arrow = t.indexOf('<');
  if(arrow > 0) t = t.slice(0, arrow);
  // 3. Английская подсказка автора перед двоеточием: «to put: ставить, класть».
  t = t.replace(/^[A-Za-z][A-Za-z \u2019'\/-]*:\s*/, '');
  // ДВОЕТОЧИЕ ВНУТРИ НЕЗАКРЫТОЙ СКОБКИ НЕ РЕЖЕТСЯ — механизм нашли review-1:
  // «совсем не (например: δεν ξέρω…)» давало остаток «совсем не (например» с
  // непарной скобкой. Он падал на знаках, то есть утечки не было, но и слова
  // человек не получал. Теперь режем по двоеточию, ВНЕ скобок стоящему, и
  // слово возвращается целым значением.
  // 4. Пример после двоеточия, если в нём греческий: «очень много: ευχαριστώ…».
  // Режем ТОЛЬКО если до двоеточия стоит настоящее слово (три русские буквы и
  // больше). Иначе «„б": μπαμπάς — папα» — правило чтения — превратилось бы в
  // вариант «„б"»: поймано плечом, а не рассуждением.
  const colon = trainerColonOutside(t);
  if(colon > 0 && /[\u0370-\u03ff\u1f00-\u1fff]/.test(t.slice(colon))
     && (t.slice(0, colon).match(/[а-яёА-ЯЁ]/g) || []).length >= 3) t = t.slice(0, colon);
  // Скобка, оставшаяся открытой после отреза, отрезается вместе со своим
  // началом: «совсем не (например» -> «совсем не».
  const open = t.lastIndexOf('(');
  if(open > 0 && t.indexOf(')', open) < 0) t = t.slice(0, open).trim();
  // 4б. СКОБКА-ПОМЕТА отрезается целиком: «они (ср.р.)» спрашивается как «они»,
  //     «кого? (м. р.)» — как «кого?». Это та же мысль, что у довеска, только
  //     на шаг раньше (находка review-1): помета в хвосте не делает негодным
  //     само слово, но и в варианте ей делать нечего — человек читает слово.
  t = t.replace(/\s*\(\s*(?:[мжср]|ср|мн|ед)\.?[^)]{0,12}\)\s*/gi,
                (m) => TRAINER_LABEL.test(m) ? ' ' : m).trim();
  // 4в. СКОБКА-ПРИМЕР отрезается целиком: «(например: δεν ξέρω καθόλου …)» —
  //     пояснение автора, а не часть перевода (записка pm про «καθόλου»).
  // «\b» здесь не годится: он считает границу по ASCII, и после кириллицы не
  //     срабатывает — поймано плечом, скобка оставалась в варианте.
  t = t.replace(/\s*\(\s*(?:например|напр|пример[ыа]?)\s*[:.,]?[^)]*\)\s*/gi, ' ').trim();
  // 5. Нумерация значений: «1. правда, истина 2. кстати» -> первое значение.
  const numbered = t.match(/^\s*1\.\s*(.+?)\s*2\.\s/);
  if(numbered) t = numbered[1];
  // 6. Хвостовое двоеточие: «с кем?:» — у автора это отделитель перед примером,
  //    а не часть перевода. Режем ТОЛЬКО когда после него ничего нет.
  t = t.replace(/\s*:\s*$/, '');
  // 7. Хвостовое многоточие: «вынимать, снимать, доставать…». Но НЕ тогда,
  //    когда оно стоит после короткого слова: «вместе с…», «от… до…» — это
  //    конструкция с продолжением, а не хвост перечисления, и обрезок «вместе
  //    с» вариантом не читается. Поймано перечнем: первая редакция резала и их.
  t = t.replace(/([а-яёА-ЯЁ]{3,})[\s,]*(?:…|\.\.\.?)\s*$/, '$1');
  return t.trim();
}
function trainerWhy(ru){
  const t = trainerTrim(ru);
  if(!t.trim()) return 'перевода нет';
  if(t.indexOf('…') >= 0 || t.indexOf('...') >= 0) return 'многоточие вместо слова';
  const core = t.replace(/\([^)]*\)/g, ' ').trim();
  if(!core) return 'вне скобок не осталось ничего';
  // ПОМЕТА СУДИТ ЯДРО, А НЕ ВЕСЬ ОСТАТОК — находка review-1, перемеренная
  // своей рукой: помета в ХВОСТЕ не делает негодным само слово. «они (ср.р.)»
  // спрашивается как «они», а «(м. р.)» остаётся отброшенным своим признаком —
  // вне скобок у него не остаётся ничего. Пул 392 -> 400, потерь ноль.
  if(TRAINER_LABEL.test(core)) return 'грамматическая помета';
  if(/[\u0370-\u03ff\u1f00-\u1fff]/.test(core)) return 'греческое в ядре';
  if(/\d/.test(core)) return 'цифры в ядре';
  if(/[—–]|\s-\s/.test(core)) return 'пример через тире';
  if(core.indexOf(':') >= 0) return 'двоеточие: правило или пояснение';
  if(!TRAINER_CORE_OK.test(core)) return 'в ядре есть знаки не из слов';
  if(!TRAINER_HAS_RU.test(core)) return 'в ядре нет русского слова';
  // ПРАВИЛО ЧТЕНИЯ УЗНАЁТСЯ ПО ФОРМЕ: ядро начинается закавыченным звуком и
  // продолжается пояснением — «„эв" перед гласной», «„б": μπαμπάς». Само по
  // себе закавыченное слово переводом быть может («“оно”»), поэтому судит не
  // кавычка, а кавычка ПЛЮС продолжение.
  if(/^[«„"“][а-яё]{1,3}[»"“”]\s*\S/.test(core)) return 'правило чтения, а не перевод';
  // СЧИТАЕМ РУССКИЕ СЛОВА, А НЕ ВСЕ: английская подсказка автора («брать, to
  // take») — приложение к переводу, а не часть предложения. Куплено перечнем:
  // без этого уходили «иду, еду, лечу, to go» и «шагать, идти пешком, to walk».
  const ruWords = core.split(/\s+/).filter(x => TRAINER_HAS_RU.test(x));
  if(ruWords.length > TRAINER_WORDS_MAX)
    return 'ядро длиннее ' + TRAINER_WORDS_MAX + ' слов: предложение, а не слово';
  return '';
}
function trainerRu(ru){ return trainerWhy(ru) === ''; }
function trainerFit(e){
  if(!e||e.head||e.pair||e.raw) return false;
  // Поле forms несёт ДВА предмета: таблицу спряжения глагола и строку алфавита
  // («Α α άλφα»). Спрашивать переводом нельзя ни то, ни другое: у буквы ответ
  // («альфа · звук «а»») повторяет сам вопрос. Отбрасываем по носителю и
  // называем оба предмета, а не один.
  if((e.forms||[]).length) return false;
  if(e.copy_of) return false;
  if(!trainerRu(e.ru)) return false;
  return !!String(e.w||'').trim()&&!!String(e.ru||'').trim();
}
function trainerPool(data){
  // ОДНО СЛОВО — ОДНА КАРТОЧКА. Автор повторяет слово в поздних уроках, иногда
  // с другим переводом («ο χρόνος»: «время» в 13-м, «время вообще; год» в
  // 14-м). Две карточки на одно слово портят сразу две вещи: слово-повтор
  // выпадает чаще прочих без всякой ошибки, а второй перевод того же слова
  // может встать ЧУЖИМ вариантом к первому — человек узнаёт слово и получает
  // красный за верное знание. Поэтому спрашиваем переводом ПЕРВОГО урока, а
  // остальные переводы носим с собой в also: они запрещены как чужие варианты.
  const out=[], at={};
  ((data&&data.sections)||[]).forEach(S=>{
    (S.entries||[]).forEach(e=>{
      if(!trainerFit(e)) return;
      const w=String(e.w).trim(), ru=trainerTrim(e.ru);
      if(at[w]!==undefined){
        const c=out[at[w]];
        if(ru!==c.ru&&c.also.indexOf(ru)<0) c.also.push(ru);
        return;
      }
      at[w]=out.length;
      // ПОЛНЫЙ ТЕКСТ АВТОРА ЕДЕТ С КАРТОЧКОЙ: после ответа человек увидит его
      // целиком, если усечённый отличался (наряд pm). До ответа его в разметке
      // нет — то же правило, что у транскрипции.
      out.push({w:w,ru:ru,full:(String(e.ru||'').trim()!==ru?String(e.ru||'').trim():''),also:[],
                tr:String(e.tr||'').trim(),
                lesson:(S.num&&!S.by_us)?S.num:'',
                section:S.title_ru||S.title||''});
    });
  });
  return out;
}
// ВОПРОС: верный ответ и три чужих, НЕблизких ни к верному, ни друг к другу.
// Не набралось трёх — вопроса нет вовсе (возвращаем null): показать человеку
// два правильных ответа хуже, чем не спросить.
function trainerQuestion(pool,card,rnd){
  const r=rnd||Math.random;
  const others=[];
  // Запрещены и ПРОЧИЕ переводы того же слова (also): они верны не меньше
  // спрошенного, и человек, знающий слово, выбрал бы их.
  const seen=[card.ru].concat(card.also||[]);
  const order=pool.map((x,i)=>({x,k:r()*1e9+i})).sort((a,b)=>a.k-b.k).map(o=>o.x);
  for(const cand of order){
    if(cand===card||cand.w===card.w) continue;
    if(seen.some(s=>trainerTooClose(s,cand.ru))) continue;
    seen.push(cand.ru);
    others.push(cand.ru);
    if(others.length===3) break;
  }
  if(others.length<3) return null;
  const options=[card.ru,...others].map((text,i)=>({text,correct:i===0}));
  for(let i=options.length-1;i>0;i--){
    const j=Math.floor(r()*(i+1));
    [options[i],options[j]]=[options[j],options[i]];
  }
  return {w:card.w,tr:card.tr,lesson:card.lesson,answer:card.ru,full:card.full||'',options};
}
// ОТВЕТ: что подсветить. Верный — зелёным; неверный — НАШ красным И верный
// зелёным (слова человека). Транскрипция приходит только здесь: до ответа её
// не показываем, иначе вопрос отвечает сам на себя.
function trainerJudge(question,picked){
  const right=question.options[picked]&&question.options[picked].correct;
  return {
    right:!!right,
    marks:question.options.map((o,i)=>o.correct?'good':(i===picked?'bad':'')),
    tr:question.tr||'',
  };
}
// ВЕС СЛОВА: ошибочные возвращаются ЧАЩЕ (заказ человека «и возвращаем чаще»).
// Вес — число шансов в выборке: верный ответ уменьшает его до 1, ошибка
// поднимает до 4. Прогресс — в браузере у каждого свой; нам он не виден.
function trainerWeight(stat){
  const s=stat||{};
  const wrong=+s.wrong||0, right=+s.right||0;
  return Math.max(1,Math.min(6,1+wrong*3-Math.min(right,2)));
}
function trainerPick(pool,stats,rnd){
  const r=rnd||Math.random;
  if(!pool.length) return null;
  const bag=[];
  pool.forEach(card=>{
    const n=trainerWeight((stats||{})[card.w]);
    for(let i=0;i<n;i++) bag.push(card);
  });
  return bag[Math.floor(r()*bag.length)]||pool[0];
}
function trainerLoad(){
  try{ return JSON.parse(localStorage.getItem(TRAINER_KEY)||'{}')||{}; }
  catch(e){ return {}; }
}
function trainerSave(stats){
  try{ localStorage.setItem(TRAINER_KEY,JSON.stringify(stats)); }catch(e){}
}
// ШОВ ДЛЯ ПРИБОРА, и он назван: чистые функции выставляются наружу, чтобы
// предмет мерился прямо (сколько статей годно, один ли верный ответ, что
// подсвечено), а не через вид. Страница от этого не меняется.
globalThis.trainer={ru:trainerRu,why:trainerWhy,trim:trainerTrim,pool:trainerPool,fit:trainerFit,question:trainerQuestion,
  judge:trainerJudge,tooClose:trainerTooClose,weight:trainerWeight,
  pick:trainerPick,words:trainerWords};

// ВИД ТРЕНАЖЁРА — ТОЖЕ ЧИСТОЙ ФУНКЦИЕЙ: карточка собирается строкой, а DOM
// только вставляет её. Поэтому прибор мерит то, что УВИДИТ человек (есть ли
// транскрипция до ответа, что подсвечено), а не моё описание этого.
function trainerCardHTML(q,judged,waiting,trouble){
  // ТРИ СОСТОЯНИЯ, А НЕ ДВА (условие наряда): «словарь ещё не пришёл» — не то
  // же, что «вопросов нет». Первое проходит само, второе означает, что в
  // словаре нечего спрашивать, и человеку они говорят разное.
  // БЕДА НАЗЫВАЕТСЯ ПЕРВОЙ: «появится сам» при 404 или пустом файле — обещание,
  // которого никто не исполнит.
  if(trouble) return '<div class="none">'+esc(trouble)+'</div>';
  if(waiting) return '<div class="none">Словарь ещё не пришёл — как придёт, '
    +'вопрос появится сам.</div>';
  if(!q) return '<div class="none">Вопросов нет: в словаре не нашлось слов, '
    +'к которым есть три непохожих перевода.</div>';
  const marks=judged?judged.marks:null;
  const opts=q.options.map((o,i)=>{
    const m=marks?(marks[i]||''):'';
    return '<button class="opt'+(m?' '+m:'')+'" data-opt="'+i+'"'
      +(marks?' disabled':'')+'>'+esc(o.text)+'</button>';
  }).join('');
  // ТРАНСКРИПЦИЯ ТОЛЬКО ПОСЛЕ ОТВЕТА (слова человека): до ответа она отвечала
  // бы за него сама.
  const tr=(judged&&q.tr)?('<div class="tr trans">['+esc(q.tr)+']</div>'):'';
  // ПОЛНЫЙ ПЕРЕВОД АВТОРА — ТОЛЬКО ПОСЛЕ ОТВЕТА И ТОЛЬКО ЕСЛИ ОТЛИЧАЛСЯ:
  // короткое в вариантах, полное — когда ответ уже дан, и тогда отрез ничего
  // не прячет (условие pm к границе «отрез живёт только в тренажёре»).
  const full=(judged&&q.full)?('<div class="tr full">у автора: '+esc(q.full)+'</div>'):'';
  const lesson=q.lesson?('<span class="tr"> · урок '+esc(q.lesson)+'</span>'):'';
  const next=judged?('<button class="next" data-next="1">Дальше</button>'):'';
  return '<div class="card"><div class="ask"><span class="w">'+esc(q.w)+'</span>'
    +lesson+'</div>'+tr+full+'<div class="opts">'+opts+'</div>'+next+'</div>';
}
function trainerStatsHTML(stats,pool){
  const s=stats||{};
  const слов=pool.length;
  const знакомы=Object.keys(s).filter(k=>(+(s[k]||{}).right||0)>0).length;
  const спотыкаемся=Object.keys(s).filter(k=>(+(s[k]||{}).wrong||0)>0).length;
  // ЧИСЛА ЧЕЛОВЕКУ — СО СВОЕЙ ЕДИНИЦЕЙ, и прогресс лежит только в его браузере:
  // нам он не виден (условие наряда).
  return 'Слов в тренажёре: '+слов+' · отвечали верно: '+знакомы
    +' · спотыкались: '+спотыкаемся+'. Прогресс хранится в этом браузере.';
}
// DOM-слой: вкладки и один обработчик на карточку. Состояние — три поля, и они
// названы: текущая карточка, текущий вопрос, разбор ответа.
let trainerState={card:null,q:null,judged:null,pool:[],stats:{}};
function trainerShow(){
  // ЧЕТЫРЕ СОСТОЯНИЯ, А НЕ ТРИ (возврат review-1): «ждём» · «беда, и вот
  // какая» · «спрашивать нечего» · вопрос. Беду называем словами страницы —
  // теми же, что человек увидел бы в словаре.
  const trouble=(!data&&pageTrouble)?pageTrouble:'';
  // ПОРЯДОК ПРОВЕРОК И ЕСТЬ ПРАВИЛО: беда называется ПЕРЕД ожиданием, и
  // лишнего условия в `waiting` для этого не нужно — оно было бы вторым
  // носителем того же порядка (и прибор показал, что оно ничего не держит:
  // снятие не краснело).
  const waiting=!data&&!trainerState.pool.length;
  trainerBox.innerHTML=trainerCardHTML(trainerState.q,trainerState.judged,waiting,trouble);
  // ПОДВАЛ НЕ НАЗЫВАЕТ ПРИЧИНУ СВОИМИ СЛОВАМИ: «не получен» было бы неправдой
  // при доехавшем словаре без разделов — та самая беда, только в меньшем месте.
  trainerFoot.textContent=trouble
    ? 'Вопросов нет: причина выше. Прогресс хранится в этом браузере.'
    : (waiting ? 'Словарь ещё не пришёл. Прогресс хранится в этом браузере.'
               : trainerStatsHTML(trainerState.stats,trainerState.pool));
}
function trainerNext(){
  trainerState.judged=null;
  trainerState.card=trainerPick(trainerState.pool,trainerState.stats);
  trainerState.q=trainerState.card?trainerQuestion(trainerState.pool,trainerState.card):null;
  trainerShow();
}
function trainerStart(){
  trainerState.pool=trainerPool(data);
  trainerState.stats=trainerLoad();
  trainerNext();
}
function trainerAnswer(i){
  if(!trainerState.q||trainerState.judged) return;
  const j=trainerJudge(trainerState.q,i);
  trainerState.judged=j;
  const key=trainerState.q.w, s=trainerState.stats[key]||{right:0,wrong:0};
  if(j.right) s.right=(+s.right||0)+1; else s.wrong=(+s.wrong||0)+1;
  trainerState.stats[key]=s;
  trainerSave(trainerState.stats);
  trainerShow();
}
function pageTab(name){
  // ТРИ ВКЛАДКИ НЕ ВЫРАЖАЮТСЯ БИНАРНЫМ ПЕРЕКЛЮЧАТЕЛЕМ, и прежний trainerTab(on)
  // пришлось заменить ИМЕНЕМ вкладки: с третьей «не-тренажёр» перестал означать
  // «словарь». Поиск и подвал словаря принадлежат словарю и прячутся вне его,

//
// Вид — подобие ОДОБРЕННОГО человеком файла (samples/exam_look_approved.html):
// белая страница, рубленый шрифт, сине-стальная гамма, каждая часть — своя

// pass_units ИЗ ЛИСТА, разбор ошибок, незаполненное считается неверным.
const EXAM_LETTERS = ['α', 'β', 'γ', 'δ', 'ε', 'ζ', 'η', 'θ', 'ι', 'κ'];
// Ярлыки ответов — ОДНИМ ПЕРЕЧНЕМ: их читают и шапка столбцов, и сами клетки
// (на телефонной ширине шапка прячется, а ярлык обязан остаться при клетке).
// Два носителя одного имени разошлись бы молча — у нас это уже случалось.
const EXAM_TF_LABELS = ['ΣΩΣΤΟ', 'ΛΑΘΟΣ'];
function examKey(part, id){ return part + ':' + id; }
function examSlots(sheet){
  const out = [];
  ((sheet && sheet.parts) || []).forEach(p => {
    (p.items || []).forEach(it => {
      const id = (p.kind === 'gaps') ? it.gap : it.id;
      out.push({ part: p.n, kind: p.kind, id: id, key: examKey(p.n, id),
                 right: examRight(p, it), text_id: it.text_id || '' });
    });
  });

}
function examRight(part, it){
  if(part.kind === 'truefalse') return it.answer === true ? 'true' : 'false';
  if(part.kind === 'choice') return String(it.answer);
  if(part.kind === 'match') return String(it.right || '');
  return String(it.word || '');
}
// ПОРЯДОК ВТОРОГО СТОЛБЦА И ЗАПАСА СЛОВ — ПЕРЕМЕШАН, И ЭТО НЕ ВИД, А ПРЕДМЕТ.
//
// Нашёл человек: в листе ответ стоял напротив своего вопроса, и задание решалось
// без чтения.
//
// ЗЕРНО — ОТ ПОПЫТКИ, А НЕ ОТ ЛИСТА, и это отличие от бумажного показа pm. На
// бумаге порядок закреплён нарочно: один лист выглядит всегда одинаково. На
// живой вкладке идёт ПОПЫТКА, и порядок обязан меняться между попытками —
// иначе его выучивают. Внутри попытки зерно не меняется: иначе варианты
// прыгали бы при каждом возврате к заданию.
//
// «ПЕРЕМЕШАНО» И «РАЗВЕДЕНО» — РАЗНЫЕ ВЕЩИ (замер dev-2 через pm: при обычном
// shuffle совпадения по месту вылезали в 118 случаях из 200 семян), и одной
// разводки тоже мало: сдвиг разводит, но порядок у всех попыток один. Поэтому
// здесь и то, и другое: перемешивание зерном попытки плюс разводка совпадений.
function examSeed(sheet, part){
  // Зерно листа — только для показа без попытки (прибор, предпросмотр).
  const s = String((sheet && sheet.made_at) || '') + '|' + String(part) + '|'
    + String((sheet && sheet.units) || '');
  let h = 2166136261;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0) || 1;
}
function examMix(seed, part){
  // Зерно ЧАСТИ выводится из зерна попытки: одно число на попытку, разные
  // порядки в разных заданиях.
  return ((Math.imul((seed || 1) >>> 0, 2654435761) ^ Math.imul(part + 1, 40503)) >>> 0) || 1;
}
function examShuffle(list, seed){
  const out = list.slice();
  let s = seed || 1;
  const rnd = () => (s = (Math.imul(s, 1103515245) + 12345) >>> 0) / 4294967296;
  for(let i = out.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = out[i]; out[i] = out[j]; out[j] = t;
  }
  return out;
}
function examArrange(list, fixed, seed){
  // `fixed[i]` — строка, которая НЕ должна встать на место i. Перемешиваем, а
  // затем разводим совпадения обменом с соседом: так порядок остаётся
  // детерминированным и ни один ответ не стоит против своего вопроса.
  let out = examShuffle(list, seed);
  for(let i = 0; i < out.length; i++){
    if(i < fixed.length && out[i] === fixed[i]){
      const j = (i + 1) % out.length;
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
  }
  // Второй проход: обмен мог вернуть совпадение на предыдущее место.
  for(let i = 0; i < out.length; i++){
    if(i < fixed.length && out[i] === fixed[i]){
      const j = (i + 2) % out.length;
      const t = out[i]; out[i] = out[j]; out[j] = t;
    }
  }
  return out;
}
function examRights(p, seed){
  const own = (p.items || []).map(it => String(it.right || ''));
  const all = own.concat((p.extra_right || []).map(String));
  return examArrange(all, own, examMix(seed, p.n));
}
function examOptions(it, part, seed){
  // ВАРИАНТЫ ПЕРЕМЕШИВАЮТСЯ ПРИ ПОКАЗЕ, И МЕСТО ВЕРНОГО ПЕРЕСЧИТЫВАЕТСЯ.
  //
  // Находка pm на трёх живых листах: заполнитель ставил верный ответ почти
  // всегда на одно место (в третьем листе — β во всех шести вопросах), и
  // «всегда второй» давало 6 из 6 без знания языка. Сторож ловит это у листа;
  // здесь — вторая половина защиты: даже кривой лист на вкладке не даёт
  // выигрышной догадки.
  //
  // Возвращаем порядок показа: массив исходных индексов. Место верного ответа
  // считается из него же — второго носителя правды о верном ответе нет.
  const n = (it.options || []).length;
  const idx = [];
  for(let i = 0; i < n; i++) idx.push(i);
  return examShuffle(idx, examMix(seed, part * 31 + (parseInt(it.id, 10) || 0) + 7));
}
function examRightPlace(it, part, seed){
  const order = examOptions(it, part, seed);
  return order.indexOf(typeof it.answer === 'number' ? it.answer : -1);
}
function examWords(p, seed){
  const own = (p.items || []).map(it => String(it.word || ''));
  const all = own.concat((p.extra_words || []).map(String));
  return examArrange(all, own, examMix(seed, p.n) ^ 0x5f5f);
}
function examPlaces(sheet, seed){
  // Места верного ответа ПРИ ПОКАЗЕ: сколько раз каждое место оказалось
  // верным. Прибор гоняет это на многих зёрнах — «всегда β» обязано исчезнуть
  // даже на листе, где оно есть.
  const out = {};
  ((sheet && sheet.parts) || []).forEach(p => {
    if(p.kind !== 'choice') return;
    (p.items || []).forEach(it => {
      const place = examRightPlace(it, p.n, seed);
      out[place] = (out[place] || 0) + 1;
    });
  });
  return out;
}
function examInPlace(sheet, seed){
  // Замер к условию человека: сколько строк стоит на месте своего вопроса.
  // Прибор гоняет его на МНОГИХ зёрнах: ноль на одном зерне ничего не
  // утверждает (мера pm, усиленная изломом dev-2).
  let n = 0;
  ((sheet && sheet.parts) || []).forEach(p => {
    if(p.kind === 'match'){
      const order = examRights(p, seed);
      (p.items || []).forEach((it, i) => { if(order[i] === String(it.right || '')) n++; });
    }
    if(p.kind === 'gaps'){
      const order = examWords(p, seed);
      (p.items || []).forEach((it, i) => { if(order[i] === String(it.word || '')) n++; });
    }
  });

}
function examKeepsAll(p, seed){
  // Лишние строки не пропали и верные все на месте: перемешивание не вправе
  // терять содержание. Отвечает парой «сколько строк · все ли верные тут».
  const isMatch = p.kind === 'match';
  const own = (p.items || []).map(it => String(isMatch ? (it.right || '') : (it.word || '')));
  const extra = ((isMatch ? p.extra_right : p.extra_words) || []).map(String);
  const order = isMatch ? examRights(p, seed) : examWords(p, seed);
  const bag = order.slice().sort();

function examScore(sheet, answers){
  const a = answers || {};

  let got = 0, units = 0;
  ((sheet && sheet.parts) || []).forEach(p => {
    let mine = 0;
    (p.items || []).forEach(it => {
      const id = (p.kind === 'gaps') ? it.gap : it.id;
      const key = examKey(p.n, id);
      const right = examRight(p, it);
      const picked = (key in a) ? String(a[key]) : '';
      if(picked === right){ mine++; }
      else {
        // НЕОТВЕЧЕННОЕ СЧИТАЕТСЯ НЕВЕРНЫМ (условие наряда), и в разборе это
        // видно словами: «не отвечено» — не то же, что «ошибся».
        wrong.push({ part: p.n, kind: p.kind, id: id, picked: picked, right: right,
                     text_id: it.text_id || '', q: it.q || it.claim || it.left || '' });
      }
    });
    byPart.push({ n: p.n, kind: p.kind, got: mine, units: p.units || (p.items || []).length });
    got += mine;
    units += (p.units || (p.items || []).length);
  });

function examWarn(p){

      const picked = (key in a) ? String(a[key]) : '';
      return '<div class="mrow' + (picked ? ' pick' : '')
        + (active === key ? ' on' : '') + '" data-slot="' + key + '" data-pickleft="'
        + key + '"><div class="num">' + esc(String(it.id)) + '</div>'
        + '<div class="txt' + examMark(picked, String(it.right || ''), show) + '">'
        + esc(it.left || '') + '</div></div>';
    }).join('') + '</div>';
  const right = '<div><div class="thead green">ΔΕΥΤΕΡΟΣ ΠΙΝΑΚΑΣ</div>'
    + '<div class="mrow r ex"><div class="txt">' + esc(ex.right || '') + '</div>'
    + '<div class="slot">0<div class="pill">ΠΑΡΑΔΕΙΓΜΑ</div></div></div>'
    + order.map(r => {
      // В клетке стоит НОМЕР вопроса, как на бумаге: сдающий видит свою работу
      // тем же способом, каким делал бы её ручкой.
      let mine = '';
      (p.items || []).forEach(it => {
        if(String(a[examKey(p.n, it.id)] || '') === r) mine = String(it.id);
      });
      return '<div class="mrow r"><div class="txt">' + esc(r) + '</div>'
        + '<div class="slot' + (mine ? ' pick' : '') + '" data-right="' + esc(r)
        + '">' + esc(mine) + '</div></div>';
    }).join('') + '</div>';
  return '<div class="letter">' + esc(letter.body || '') + '</div>'
    + '<div class="two">' + left + right + '</div>';
}
function examChoiceHTML(p, answers, show, seed){
  const a = answers || {};
  const ex = p.example || {};
  const dials = (p.texts || []).map((t, i) => '<div class="bubble b' + (i % 3 + 1) + '">'
    + '<div class="dtab">ΔΙΑΛΟΓΟΣ ' + esc(String(t.id)) + '</div>'
    + '<div class="body">' + esc(t.body || '') + '</div><div class="tail"></div></div>').join('');
  const exBlock = '<div class="q ex"><div class="qt"><span class="n">0</span> '
    + esc(ex.q || '') + '<div class="pill">ΠΑΡΑΔΕΙΓΜΑ</div></div><ol class="opts">'
    + (ex.options || []).map((o, i) => '<li><span class="gl">' + EXAM_LETTERS[i]
      + '</span> ' + esc(o) + (i === ex.answer ? ' <span class="tick">✓</span>' : '')
      + '</li>').join('') + '</ol></div>';
  const items = (p.items || []).map(it => {
    const key = examKey(p.n, it.id);
    const picked = (key in a) ? String(a[key]) : '';
    // Буква ярлыка идёт по МЕСТУ показа, а значение кнопки — исходный индекс
    // варианта: балл считается по листу, а не по тому, как мы его показали.
    const order = examOptions(it, p.n, seed);
    const opts = order.map((src, place) => '<li><span class="gl">'
      + EXAM_LETTERS[place] + '</span> ' + esc((it.options || [])[src])
      + '<button class="box' + (picked === String(src) ? ' pick' : '')
      + '" data-ans="' + key + '" data-val="' + src + '"></button></li>').join('');
    return '<div class="q"><div class="qt" data-slot="' + key + '"><span class="n">'
      + esc(String(it.id)) + '</span> <span class="'
      + examMark(picked, String(it.answer), show).trim() + '">' + esc(it.q || '')
      + '</span></div><ol class="opts">' + opts + '</ol></div>';
  }).join('');
  return '<div class="dials">' + dials + '</div>' + exBlock + items;
}
function examGapsHTML(p, answers, show, seed, active){
  const a = answers || {};
  const ex = p.example || {};
  const words = examWords(p, seed);
  let text = esc(p.text || '');
  text = text.replace(new RegExp('___' + ex.gap + '___', 'g'),
    '<span class="gap"><i></i><b>' + esc(String(ex.gap)) + '</b><i></i></span>');
  (p.items || []).forEach(it => {
    const key = examKey(p.n, it.gap);
    const picked = (key in a) ? String(a[key]) : '';
    text = text.replace(new RegExp('___' + it.gap + '___', 'g'),
      '<span class="gap' + (active === key ? ' on' : '') + examMark(picked, String(it.word || ''), show)
      + '" data-slot="' + key + '" data-gap="' + key + '"><i></i><b>'
      + (picked ? esc(picked) : esc(String(it.gap))) + '</b><i></i></span>');
  });
  const bank = words.map(w => {
    let mine = '';
    (p.items || []).forEach(it => {
      if(String(a[examKey(p.n, it.gap)] || '') === w) mine = String(it.gap);
    });
    return '<div class="bw"><div class="txt" data-word="' + esc(w) + '">' + esc(w)
      + '</div><div class="slot' + (mine ? ' pick' : '') + '">' + esc(mine) + '</div></div>';
  }).join('');
  const exWord = '<div class="bw ex"><div class="txt">' + esc(ex.word || '')
    + '</div><div class="slot">' + esc(String(ex.gap)) + '<div class="pill">ΠΑΡΑΔΕΙΓΜΑ</div>'
    + '</div></div>';
  return '<div class="gaptext">' + text + '</div><div class="bank">' + exWord + bank + '</div>';
}
function examPartHTML(p, answers, show, seed, active){
  const body = p.kind === 'truefalse' ? examTFHTML(p, answers, show)
    : p.kind === 'match' ? examMatchHTML(p, answers, show, seed, active)
    : p.kind === 'choice' ? examChoiceHTML(p, answers, show, seed)
    : examGapsHTML(p, answers, show, seed, active);
  return examHeadHTML(p) + body;
}
function examSheetHTML(sheet, answers, show, active, seed){
  if(!sheet) return '';
  // Зерна попытки нет (предпросмотр, прибор) — берём зерно листа: порядок тогда
  // одинаков, и это честно названо, а не выдано за попытку.
  const s = seed || examSeed(sheet, 0);
  // Первая страница — обложка, дальше по странице на задание; последняя несёт
  // ΤΕΛΟΣ вместо ΓΥΡΙΣΤΕ ΣΕΛΙΔΑ.
  const parts = (sheet.parts || []);
  let out = examPageHTML(1, examCoverHTML(sheet), false);
  parts.forEach((p, i) => {
    out += examPageHTML(i + 2, examPartHTML(p, answers, show, s, active),
                        i === parts.length - 1);
  });
  return out;
}
function examShow(kind, value, sheet, w){
  // Разбор ошибок показывает ОТВЕТ СЛОВАМИ, а не индексом: «γ» и «2» человек не
  // сличит с тем, что видел на листе.
  if(kind === 'truefalse') return value === 'true' ? 'ΣΩΣΤΟ' : 'ΛΑΘΟΣ';
  if(kind === 'choice'){
    const part = (sheet.parts || []).filter(p => p.n === w.part)[0] || {};
    const it = (part.items || []).filter(x => String(x.id) === String(w.id))[0] || {};
    const i = parseInt(value, 10);
    const o = (it.options || [])[i];
    return (EXAM_LETTERS[i] || '?') + ') ' + (o === undefined ? '' : o);
  }
  return value;
}
function examScoreHTML(sheet, answers){
  const s = examScore(sheet, answers);
  const rows = s.byPart.map(p => '<div class="exrow">ΕΡΩΤΗΜΑ ' + p.n + ': ' + p.got
    + ' из ' + p.units + '</div>').join('');
  const verdict = s.passed === null ? 'порог в листе не назван'
    : (s.passed ? 'сдано' : 'не сдано') + ' (порог ' + s.pass_units + ' из ' + s.units + ')';
  const wrong = s.wrong.map(w => '<div class="exrow">ΕΡΩΤΗΜΑ ' + w.part + ', '
    + (w.kind === 'gaps' ? 'пропуск ' : 'вопрос ') + w.id + ': '
    + (w.picked === '' ? '<span class="exbad">не отвечено</span>'
       : 'ваш ответ <span class="exbad">' + esc(examShow(w.kind, w.picked, sheet, w))
       + '</span>')
    + ' · верно <span class="exgood">' + esc(examShow(w.kind, w.right, sheet, w)) + '</span>'
    + (w.text_id ? ' · текст ' + esc(String(w.text_id)) : '') + '</div>').join('');
  return '<div class="exscore"><div class="big">' + s.got + ' из ' + s.units + '</div>'
    + '<div class="exrow">' + esc(verdict) + '</div>' + rows
    + (wrong ? '<div class="exrow exlab">РАЗБОР ОШИБОК</div>' + wrong : '') + '</div>';
}
globalThis.exam = { slots: examSlots, score: examScore, left: examLeft, clock: examClock,
                    sheetHTML: examSheetHTML, partHTML: examPartHTML,
                    scoreHTML: examScoreHTML, warn: examWarn, right: examRight,
                    rights: examRights, words: examWords, inPlace: examInPlace,
                    keepsAll: examKeepsAll, seed: examSeed, mix: examMix,
                    options: examOptions, rightPlace: examRightPlace,
                    places: examPlaces };

// ──────── DOM: состояние названо полями, и каждое отвечает за своё
let examState = { sheet: null, answers: {}, started: 0, done: false,
                  left: '', gap: '', tick: 0, seed: 0 };
function examRender(){
  if(!examState.sheet) return;
  const show = examState.done;
  const secs = examLeft(examState.started, Date.now(), examState.sheet.minutes);
  const head = '<div class="extimer' + (secs <= 60 && !examState.done ? ' exlow' : '') + '">'
    + '<span>' + (examState.done ? 'ΕΞΕΤΑΣΗ ΤΕΛΟΣ' : 'ΥΠΟΛΟΙΠΟΣ ΧΡΟΝΟΣ') + '</span>'
    + '<b>' + examClock(secs) + '</b>'
    + (examState.done ? '<button class="exbtn" data-exam="again">Заново</button>'
       : '<button class="exbtn" data-exam="finish">Закончить</button>') + '</div>';
  const active = examState.left || examState.gap;
  examBox.innerHTML = head
    + (examState.done ? examScoreHTML(examState.sheet, examState.answers) : '')
    + examSheetHTML(examState.sheet, examState.answers, show, active, examState.seed);
  const slots = examSlots(examState.sheet);
  const answered = slots.filter(s => s.key in examState.answers).length;
  examFoot.textContent = 'Отвечено ' + answered + ' из ' + slots.length
    + ' · μονάδες ' + examState.sheet.units + ' · порог ' + examState.sheet.pass_units
    + '. Незаполненное по истечении времени считается неверным.';
}
function examFinish(){
  examState.done = true;
  if(examState.tick){ clearInterval(examState.tick); examState.tick = 0; }
  examRender();
}
function examStart(){
  examState.answers = {};
  examState.done = false;
  examState.left = '';
  examState.gap = '';
  examState.started = Date.now();
  // ЗЕРНО ПОПЫТКИ БЕРЁТСЯ ОДИН РАЗ, В НАЧАЛЕ: внутри попытки порядок не
  // шевелится, между попытками — меняется.
  examState.seed = ((Date.now() ^ Math.floor(Math.random() * 4294967296)) >>> 0) || 1;
  if(examState.tick) clearInterval(examState.tick);
  // ТАЙМЕР ВИДЕН ВСЁ ВРЕМЯ и САМ заканчивает экзамен: иначе «незаполненное
  // считается неверным» зависело бы от того, нажмёт ли человек кнопку.
  examState.tick = setInterval(() => {
    if(examLeft(examState.started, Date.now(), examState.sheet.minutes) <= 0) examFinish();
    else examRender();
  }, 1000);
  examRender();
}
examBox.addEventListener('click', ev => {
  const t = ev.target;
  const btn = t.closest && t.closest('[data-exam]');
  if(btn){
    if(btn.getAttribute('data-exam') === 'finish') examFinish(); else examStart();
    return;
  }
  if(examState.done) return;   // после конца лист только читают
  const ans = t.closest && t.closest('[data-ans]');
  if(ans){
    examState.answers[ans.getAttribute('data-ans')] = ans.getAttribute('data-val');
    examRender();
    return;
  }
  // Сопоставление: сперва строка слева, затем концовка справа — как ручкой на
  // бумаге, где номер вписывают в клетку второго столбца.
  const lrow = t.closest && t.closest('[data-pickleft]');
  if(lrow){
    examState.left = lrow.getAttribute('data-pickleft');
    examState.gap = '';
    examRender();
    return;
  }
  const rcell = t.closest && t.closest('[data-right]');
  if(rcell && examState.left){
    examState.answers[examState.left] = rcell.getAttribute('data-right');
    examState.left = '';
    examRender();
    return;
  }
  const gap = t.closest && t.closest('[data-gap]');
  if(gap){ examState.gap = gap.getAttribute('data-gap'); examState.left = ''; examRender(); return; }
  const word = t.closest && t.closest('[data-word]');
  if(word && examState.gap){
    examState.answers[examState.gap] = word.getAttribute('data-word');
    examState.gap = '';
    examRender();
  }
});
// ЛИСТ БЕРЁТСЯ РЯДОМ С СТРАНИЦЕЙ, КАК dict.json. Нет листа или он не разобрался —
// вкладки нет вовсе, и это названная ветка, а не пустой экран.
fetch('exam_reading.json?' + Date.now()).then(r => {
  if(!r.ok) return null;
  return r.text().then(t => { try { return JSON.parse(t); } catch(e){ return null; } });
}).then(sheet => {
  if(!sheet || !Array.isArray(sheet.parts) || !sheet.parts.length) return;
  examState.sheet = sheet;
  tabExam.hidden = false;
}).catch(() => {});

q.addEventListener('input',()=>render(q.value));
</script>
