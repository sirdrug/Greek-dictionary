<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Словарик по урокам</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--p:#5B2A6E;--g:#8A8A8A;--d:#313131;--ours:#7A6E86;--bg:#fff;--line:#ece7ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--d);
     font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
       padding:10px 14px 8px;z-index:5}
h1{margin:0 0 8px;font-size:19px;color:var(--p)}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
   font-size:16px;outline:none}
#q:focus{border-color:var(--p)}
.hint{color:var(--g);font-size:12px;margin:6px 2px 0}
main{padding:0 14px 40px}
.les{margin:16px 0 6px;background:var(--p);color:#fff;border-radius:7px;padding:7px 10px;
     cursor:pointer;scroll-margin-top:96px}
.e{cursor:pointer}
.les b{display:block;font-size:15px}
.les span{display:block;font-size:11.5px;color:#D9CDE0;margin-top:2px}
.e{padding:5px 2px;border-bottom:1px solid var(--line)}
.w{color:var(--p);font-weight:700}
.tr{color:var(--g);font-size:14px}
.ru{color:var(--d)}
.ours{color:var(--ours)}
.sub{color:var(--p);font-weight:700;font-size:14px;margin:12px 2px 2px;scroll-margin-top:96px}
.jump{margin:6px 2px 2px;font-size:14px}
.jump a{color:var(--p);text-decoration:none;border-bottom:1px dotted var(--p)}
.conj{margin:3px 0 1px;font-size:14px}
.conj span{color:var(--d)}
.conjhead{color:var(--g);font-size:12px;margin:2px 0 3px}
.conjt{border-collapse:collapse;margin:2px 0 4px;font-size:14px}
.conjt td{padding:1px 8px 1px 0;vertical-align:baseline}
.stem{color:var(--g)}
.end{color:var(--p);font-weight:700}
.none{color:var(--g);padding:18px 2px}
.tabs{display:flex;gap:8px;padding:8px 14px 0}
.tab{border:1px solid var(--line);background:var(--bg);color:var(--g);
     border-radius:9px;padding:7px 14px;font-size:14px;cursor:pointer}
.tab.on{color:var(--p);border-color:var(--p);font-weight:700}
.card{padding:14px 2px}
.ask{font-size:26px;margin:6px 0 2px}
.trans{font-size:15px;margin:0 0 6px}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);
     color:var(--d);border-radius:9px;padding:11px 12px;font-size:16px;cursor:pointer}
.opt.good{border-color:#2E7D32;background:#EAF5EA;color:#1B5E20;font-weight:700}
.opt.bad{border-color:#C62828;background:#FBEAEA;color:#B71C1C}
.next{margin-top:4px;border:1px solid var(--p);background:var(--p);color:#fff;
      border-radius:9px;padding:10px 16px;font-size:15px;cursor:pointer}
footer{color:var(--g);font-size:12px;padding:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Словарик по урокам</h1>
  <input id="q" placeholder="поиск: слово, «урок 7» или цифра" autocomplete="off">
  <!-- Третье предложение шапки снято 20.10 по наряду; довод — в README, где
       перечислено снятое. Здесь его нет нарочно: страница уезжает к человеку,
       записки остаются в репозитории.
       Цвет оставлен: оттенок — это вид, а не утверждение. -->
  <div class="hint">Нажмите на слово или плашку — перейдёте к разделу целиком.
  Цифра показывает раздел чисел.</div>
</header>
<div class="tabs">
  <button id="tabDict" class="tab on">Словарь</button>
  <button id="tabTrainer" class="tab">Тренажёр</button>
</div>
<main id="dict"><div id="out"></div></main>
<main id="trainer" hidden><div id="trainerBox"></div></main>
<footer id="foot"></footer>
<footer id="trainerFoot"></footer>
<!-- СТРАНИЦА НАЗЫВАЕТ СЕБЯ, и это отдельная строка, а не часть «найдено».

     Наряд pm по живому случаю (23.10): человек открыл словарик из телеграма и
     не увидел урока 15, хотя всё уехало. Сайт отдавал новое (72 037 б, разделов
     16), но у гитхаба max-age=600, а у телеграма свой кэш — и мы с ним ГАДАЛИ,
     кэш это или дефект. Прибор, который не называет себя, заставляет гадать о
     предмете; у нас это сегодня стоило кругов пять раз.

     Поэтому строка берёт числа ИЗ ЗАГРУЖЕННОГО ФАЙЛА, а не из нашей веры: имя
     версии, если служба его положила, длину полученного и время с заголовка
     ответа. -->
<footer id="self"></footer>
<script>
const out=document.getElementById('out'), q=document.getElementById('q'),
      foot=document.getElementById('foot'),
      trainerBox=document.getElementById('trainerBox'),
      trainerFoot=document.getElementById('trainerFoot'),
      tabDict=document.getElementById('tabDict'),
      tabTrainer=document.getElementById('tabTrainer'),
      меня=document.getElementById('self');
let data=null;
try{ if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();} }catch(e){}
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// Разметка ПО КЛАССУ ЗНАКА: греческий кусок — фиолетовым полужирным,
// [в скобках] — серым, прочее — тёмным. Так подсвечены ВСЕ строки,
// а не только те, что разобрались на слово+транскрипцию.
const GREEK=/[\u0370-\u03FF\u1F00-\u1FFF][\u0370-\u03FF\u1F00-\u1FFF\s,·]*|\[[^\]]*\]/g;
// КОПИЯ — СТАТЬЯ, СОБРАННАЯ В НАШ РАЗДЕЛ ИЗ УРОКА, и в счёт слов она не идёт.
//
// Собирающий раздел складывает слова, НЕ вынимая их из уроков (заказ человека
// 27.10: «должны оставаться в уроках и отдельно собираться»), поэтому одно
// слово лежит в данных дважды. Посчитать их дважды значило бы сказать человеку,
// что слов стало больше, — а их столько же. Та же мерка стоит у бота
// (Dict.Originals) и обязана стоять у службы.
//
// НОСИТЕЛЬ СЧЁТА ОДИН — `copy_of`, и это решение pm от 27.10 (20:08): поле
// ставит служба и только при ДОСЛОВНОМ совпадении `w` и `ru` с уроком. Отсюда
// названная цена: собранная статья, в которой перевод при сборке подправили,
// копией уже не считается и в «статей» войдёт — то есть счёт зависит от чужой
// сборки. Второго носителя («раздел собирающий») я не завёл намеренно: два
// носителя одного предмета у нас молча расходились дважды за месяц.
function копия(e){ return !!(e&&e.copy_of); }
// СТАТЬЯ — ЭТО СТАТЬЯ, А НЕ ВСЯКАЯ ЗАПИСЬ, и это расхождение я поймал прогоном
// своего же прибора на живых данных 27.10:
//
//	страница  «статей: 369»
//	бот       «статей 337 · строк-пометок 32» на ТОМ ЖЕ файле
//
// Разница ровно в пометках: подзаголовки урока, пары родов и вольные строки
// документа статьями не являются ни у бота, ни у сторожа, а страница считала их
// вместе со статьями. Человек, сверяя подвал страницы с карточкой бота, видел
// расхождение в 32 — и шёл искать потерю, которой нет.
//
// Теперь мерка одна на всех: статья — запись со словом и без пометки; копии
// собирающего раздела не считаются (см. `копия`). Пометки не исчезают из
// подвала, а названы своим числом: иначе падение 369 -> 337 читалось бы как
// потеря слов.
function статья_(e){
  return !!e && !e.head && !e.pair && !e.raw && !!(e.w||'').trim() && !копия(e);
}
function статей_(secs){
  return (secs||[]).reduce((n,S)=>n+(S.entries||[]).filter(статья_).length,0);
}
function пометок_(secs){
  return (secs||[]).reduce((n,S)=>n+(S.entries||[]).filter(e=>e&&(e.head||e.pair||e.raw)).length,0);
}
// ПОДГРУППЫ РАЗДЕЛА — ИЗ ДАННЫХ: объявленные в `groups` (их перечень держит
// служба, имена латиницей), а за ними те, что встретились у статей, но в
// перечне не названы. Своего списка имён у страницы нет намеренно: человек
// сказал, что группы добавятся, и пятая обязана приехать одним дописыванием.
//
// Неназванная подгруппа не прячется: иначе расхождение перечня со статьями
// (правка службы, наша старая выгрузка) тихо съело бы слова.
function подгруппы(S){
  const out=[], было={};
  (S&&S.groups||[]).forEach(g=>{ g=(g||'').trim(); if(g&&!было[g]){было[g]=1;out.push(g);} });
  (S&&S.entries||[]).forEach(e=>{ const g=(e.group||'').trim(); if(g&&!было[g]){было[g]=1;out.push(g);} });
  return out;
}
// Имя подгруппы человеку: «Глаголы A1» — имя раздела из данных плюс имя группы
// из данных. Слова «Глаголы» в коде страницы нет: переименуют раздел —
// подзаголовки пойдут за ним сами.
// КЛЮЧ ПОДГРУППЫ: «A1», «а1», «a 1» — одно и то же.
//
// Человек писал имена групп русскими буквами («а1»), пока не решил «называем
// латиницей» (27.10). Двойники перечислены СПИСКОМ: кириллическая «А» и
// латинская «A» — разные знаки с одним рисунком, и никакой признак их не
// сблизит. Та же таблица и тот же довод стоят у бота (groupKey) — предмет один,
// но носителя два: у страницы и бота разные языки, и свести их в один нечем.
// Расхождение не молчит: прибор сличает ответы обоих на одном входе.
const ДВОЙНИКИ={'А':'A','В':'B','С':'C','Е':'E','Н':'H','К':'K','М':'M','О':'O','Р':'P','Т':'T','Х':'X'};
function ключГруппы(s){
  return Array.from(String(s||'').toUpperCase())
    .filter(c=>c!==' '&&c!=='\t'&&c!=='_'&&c!=='-')
    .map(c=>ДВОЙНИКИ[c]||c).join('');
}
const имяПодгруппы=(S,g)=>((S.title_ru||S.title||'')?((S.title_ru||S.title)+' '+g):g);
// ЛИЦА ПРИЕЗЖАЮТ У СТАТЬИ, ВМЕСТЕ С ФОРМАМИ, а не списком здесь.
//
// Служба пишет «μένω · я=μένω · ты=μένεις · …», сборка раскладывает это в
// `forms` и `persons` у статьи. Своего списка у страницы нет: подписать формы
// по порядку своим списком значило бы завести носитель, связанный с промптом
// заполнителя только словом (решение pm по моей же находке).
//
// МЕСТОИМЕНИЕ — ВИД, А НЕ ПОРЯДОК: ищется по ИМЕНИ ЛИЦА в `pronouns` из данных.
// Имени нет — печатаем лицо без местоимения, выдуманное было бы хуже.
function местоимение(лицо){
  const k=String(лицо||'').trim().toLowerCase();
  return ((data&&data.pronouns)||[]).find(p=>String(p.ru||'').trim().toLowerCase()===k)||null;
}
// ОБЩАЯ ЧАСТЬ ФОРМ — ТО, ЧТО У ВСЕХ ШЕСТИ ОДИНАКОВО С НАЧАЛА СЛОВА.
//
// Человек утвердил на макете pm форму, в которой основа и окончание видны
// ПОРОЗНЬ: «ученик должен понимать, на что меняется в глаголе окончание».
// Деление считается ИЗ САМИХ ФОРМ, а не по списку окончаний для каждой группы:
// такой список — правило греческого языка, оно живёт в промпте агента, и
// второй его носитель здесь разошёлся бы с первым молча.
//
// Счёт по БУКВАМ (Array.from), а не по знакам UTF-16: это та же моя ошибка, что
// с «байтами» в подвале, только на другом конце — греческая буква с ударением
// может быть парой.
// Варианты одной формы пишутся через «/» в одной ячейке («μένουν/μένουνε»):
// человек просил два варианта на «они», где учебники их дают. Общая часть
// считается по ВСЕМ вариантам — иначе второй получил бы чужую основу.
function варианты(fs){
  const out=[];
  (fs||[]).forEach(f=>String(f).split('/').forEach(v=>{ v=v.trim(); if(v) out.push(v); }));
  return out;
}
function общая(fs0){
  const fs=варианты(fs0);
  if(!fs.length) return '';
  let g=Array.from(fs[0]);
  for(const f of fs.slice(1)){
    const r=Array.from(f); let i=0;
    while(i<g.length&&i<r.length&&g[i]===r[i]) i++;
    g=g.slice(0,i);
  }
  return g.join('');
}
function byClass(t){
  let out='',last=0,m;
  GREEK.lastIndex=0;
  while((m=GREEK.exec(t))!==null){
    if(m.index>last) out+='<span class="ru">'+esc(t.slice(last,m.index))+'</span>';
    out+= m[0][0]==='[' ? '<span class="tr">'+esc(m[0])+'</span>'
                        : '<span class="w">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  if(last<t.length) out+='<span class="ru">'+esc(t.slice(last))+'</span>';
  return out;
}
// ТАБЛИЦА СПРЯЖЕНИЯ ПО ФОРМЕ, УТВЕРЖДЁННОЙ ЧЕЛОВЕКОМ (макет pm, он правил
// дважды): лицо · местоимение · транскрипция местоимения · форма · окончание.
//
// Основа серым, окончание цветом — его требование: «ученик должен понимать, на
// что меняется в глаголе окончание», и порознь значит порознь, а не одной
// склеенной формой.
//
// Подпись над таблицей говорит ТО, ЧТО ИЗМЕРЕНО: «общая часть μέν-». В письме
// pm она звучала «основа μέν- — она не меняется», но для неправильной группы
// это неправда (у λέω/λες общая часть — одна буква «λ», и основа меняется
// тоже; pm сами это назвали). Учить человека неверному правилу нельзя, и
// отступление от их слов названо письмом.
//
// Пометок о происхождении нет ни одной — прямой и дважды повторённый запрет.
function спряжение(e,li){
  const d=' data-l="'+li+'"', fs=(e.forms||[]).filter(x=>(x||'').trim()),
        лица=(e.persons||[]), st=общая(fs);
  let h='<div class="e"'+d+'><span class="w">'+esc(e.w||'')+'</span>';
  if(e.tr) h+=' <span class="tr">['+esc(e.tr)+']</span>';
  if(e.ru) h+=' <span class="ru">— '+esc(e.ru)+'</span>';
  if(st) h+='<div class="conjhead">образец '+esc(e.w||'')+' · общая часть '+
            esc(st)+'-, дальше меняется окончание</div>';
  // ТРЕТИЙ ИСХОД НАЗВАН ТРЕТЬИМ: формы есть, а лиц к ним нет — печатаем формы
  // списком, без выдуманных подписей.
  if(лица.length!==fs.length){
    h+='<div class="conj"><span>'+esc(fs.join(' · '))+'</span></div>';
    return h+'</div>';
  }
  h+='<table class="conjt">'+fs.map((f,i)=>{
    const имя=лица[i]||'', p=местоимение(имя)||{}, vs=варианты([f]),
          нач=Array.from(st).length;
    const формы=vs.map(v=>{
      const ок=Array.from(v).slice(нач).join('');
      return ок?('<span class="stem">'+esc(st)+'</span><span class="end">'+esc(ок)+'</span>')
               :('<span class="stem">'+esc(v)+'</span>');
    }).join('<span class="tr"> / </span>');
    const окончания=vs.map(v=>Array.from(v).slice(нач).join(''))
                      .filter(x=>x).map(x=>'-'+esc(x)).join(' / ');
    return '<tr><td class="tr">'+esc(имя)+'</td>'+
           '<td class="w">'+esc(p.w||'')+
             (p.tr?('<div class="tr">['+esc(p.tr)+']</div>'):'')+'</td>'+
           '<td>'+формы+'</td>'+
           '<td class="end">'+окончания+'</td></tr>';
  }).join('')+'</table>';
  return h+'</div>';
}
function entry(e,li,метка){
  const d=' data-l="'+li+'"';
  if(e.head) return '<div class="sub"'+d+'>'+esc(e.ru)+'</div>';
  if((e.forms||[]).length&&(e.group||'')) return спряжение(e,li);
  if(e.raw||e.pair) return '<div class="e"'+d+'>'+byClass(e.ru)+'</div>';
  const ourTr=(e.ours||[]).includes('tr'), ourRu=(e.ours||[]).includes('ru');
  let h='<div class="e"'+d+'><span class="w">'+esc(e.w)+'</span>';
  if(e.tr) h+=' <span class="tr'+(ourTr?' ours':'')+'">['+esc(e.tr)+']</span>';
  // Цифру рисует ПОТРЕБИТЕЛЬ: в данных она одним полем `digits`. Приписка к
  // переводу слепила бы сторожа дыры — у статьи с пустым переводом поле всё
  // равно было бы непусто (находка review-1).
  const ru=e.digits?(e.digits+' — '+(e.ru||'')):e.ru;
  if(ru) h+=' <span class="'+(ourRu?'ours':'ru')+'">— '+esc(ru)+'</span>';
  // МЕТКА ПОДГРУППЫ — ТОЛЬКО В НАЙДЕННОМ, где подзаголовка группы рядом нет.
  //
  // Человек заказал «понять, какой он формы, и назвать как сказал я». В
  // разделе целиком форму называет подзаголовок; в выдаче поиска подзаголовка
  // нет, и без метки найденный глагол о своей форме не говорит ничего.
  if(метка) h+=' <span class="tr">· '+esc(метка)+'</span>';
  return h+'</div>';
}
// Поиск ищет И по урокам: совпал номер, греческое название или перевод
// названия — урок показывается ЦЕЛИКОМ. Иначе «урок 7» не находило ничего,
// потому что слова «урок» нет ни в одной статье.
// РАЗДЕЛ ОПОЗНАЁТСЯ ПО СТРОЕНИЮ, А НЕ ПО ИМЕНИ (форма dev-1): страница обходит
// `sections` и не знает, сколько их и как они зовутся. Есть `num` — урок; нет —
// раздел без номера (числа), и плашка пишет только название: «Урок undefined»
// было бы хуже отсутствия номера.
const barText=S=>S.num?('Урок '+S.num+' · '+(S.title||'')):(S.title||'');
// ЧИСТАЯ ЦИФРА ПОКАЗЫВАЕТ РАЗДЕЛ ЦЕЛИКОМ, и так просил человек: «цифры просто в
// поиске как цифры должны показывать раздел». Поэтому «347», которого в опорных
// нет, выводит раздел чисел, а не «такого слова нет»: второе утверждало бы о
// словаре то, чего в нём не смотрели.
const hasDigits=S=>(S.entries||[]).some(e=>e.digits);
// ПОДГРУППА, НАБРАННАЯ ЧЕЛОВЕКОМ: «A1», «а1», «глаголы A1» — какая именно.
//
// Заказ человека (через pm, 27.10): «путь по типу в поиске показывается новый
// раздел», и бот на тот же запрос отдаёт ТОЛЬКО этот подтип. Страница делает
// то же: иначе два прибора на одно слово ответят по-разному.
//
// Перечень открываемого — из данных (`groups`): пятая группа станет путём сама.
function подгруппаПоИмени(S,f){
  const k=ключГруппы(f);
  if(!k) return '';
  const имена=[(S.title_ru||''),(S.title||'')];
  for(const g of подгруппы(S)){
    if(ключГруппы(g)===k) return g;
    for(const nm of имена) if(nm&&ключГруппы(nm+g)===k) return g;
  }
  return '';
}
function sectionHit(S,f){
  if(!f) return false;
  if(подгруппаПоИмени(S,f)) return true;
  if(/^[0-9]+$/.test(f)&&hasDigits(S)) return true;
  if(S.num){
    const num=('урок '+S.num+' '+S.num).toLowerCase();
    if(num.includes(f)||f.includes('урок '+S.num)) return true;
  }
  return (S.title||'').toLowerCase().includes(f)
       ||(S.title_ru||'').toLowerCase().includes(f)
       // Строка о составе тоже ищется: «составные» и «буквосочетания» — слова,
       // которыми человек спросит про то, чего в разделе НЕТ.
       ||(S.about||'').toLowerCase().includes(f);
}
function render(filter){
  const f=(filter||'').trim().toLowerCase();
  const secs=data.sections||[];
  let html='', shownE=0, shownS=0;
  secs.forEach((S,i)=>{
    const all=S.entries||[];
    const whole=sectionHit(S,f);
    const es=whole?all
                  :all.filter(e=>!f||((e.w+' '+e.tr+' '+e.ru+' '+(e.digits||''))
                                      .toLowerCase().includes(f)));
    if(!es.length) return;
    shownS++;
    html+='<div class="les" id="sec'+i+'" data-l="'+i+'">'+
          '<b>'+esc(barText(S))+'</b>'+
          (S.title_ru?'<span>'+esc(S.title_ru)+'</span>':'')+'</div>';
    // Строка о составе — СВОЙСТВО раздела, а не статья в нём: один носитель на
    // страницу, бумагу и бота (просьба dev-1). Рисуется там же, где стояла
    // прежним пояснением — первой, до статей.
    if(S.about) html+='<div class="sub" data-l="'+i+'">'+esc(S.about)+'</div>';
    // НАБРАЛ ПОДТИП — ПОКАЗЫВАЕМ ПОДТИП, и только его: так же, как бот.
    const однаГруппа=подгруппаПоИмени(S,f);
    const гр=однаГруппа?[однаГруппа]:подгруппы(S);
    // РАЗДЕЛ ПОКАЗАН ЦЕЛИКОМ И БЕЗ ПОИСКА — ТОЖЕ ЦЕЛИКОМ, и это находка
    // человека (28.10): «не вижу разделения… нет подзаголовка — сразу таблица
    // с первым глаголом группы».
    //
    // Причина была в условии: подгруппы рисовались при `whole`, а `whole` —
    // это ПОПАДАНИЕ раздела в поиск, и при пустом поиске он ложен (см.
    // sectionHit: `if(!f) return false`). То есть ровно в самом частом случае
    // — человек открыл страницу и ничего не набрал — раздел шёл плоским
    // списком с мелкой меткой у статьи. Подзаголовки были, но их никто не
    // видел.
    const целиком=whole||!f;
    if(гр.length&&целиком){
      // РАЗДЕЛ С ПОДГРУППАМИ, ПОКАЗАННЫЙ ЦЕЛИКОМ, РИСУЕТСЯ ПОДГРУППАМИ.
      // Признак — строение данных (`groups` или `group` у статьи), а не имя
      // раздела: имени «Глаголы» на странице в коде нет.
      // Строки без подгруппы идут перед подгруппами — но не тогда, когда
      // человек спросил ОДНУ подгруппу: он просил её, а не раздел.
      if(!однаГруппа){
        const без=es.filter(e=>!(e.group||''));
        shownE+=без.length;
        html+=без.map(e=>entry(e,i)).join('');
      }
      // ПЕРЕХОД К ТИПУ — ССЫЛКАМИ В НАЧАЛЕ РАЗДЕЛА (заказ человека: «нельзя
      // перейти на глаголы того или иного типа»). Имена берутся из `groups`,
      // как и подзаголовки: своего списка у страницы нет.
      //
      // Показываем перечень только когда нарисованы ВСЕ подгруппы: если человек
      // спросил одну, ссылки на остальные вели бы в пустоту.
      if(!однаГруппа&&гр.length>1){
        html+='<div class="jump">'+гр.map(g=>
          '<a href="#grp'+i+'-'+esc(g)+'" data-go="grp'+i+'-'+esc(g)+'">'+esc(g)+'</a>'
        ).join('<span class="tr"> · </span>')+'</div>';
      }
      гр.forEach(g=>{
        html+='<div class="sub" id="grp'+i+'-'+esc(g)+'" data-l="'+i+'">'+
              esc(имяПодгруппы(S,g))+'</div>';
        const свои=es.filter(e=>(e.group||'')===g);
        shownE+=свои.length;
        // Подгруппа из перечня, которой в данных нет, называется СЛОВАМИ:
        // иначе заказанная человеком группа исчезла бы молча, и «её ещё не
        // собрали» читалось бы как «её нет».
        html+=свои.length?свои.map(e=>entry(e,i)).join('')
                         :'<div class="e" data-l="'+i+'">в словаре пока ни одного слова этой группы</div>';
      });
    } else {
      // В выдаче поиска подгруппа идёт МЕТКОЙ у статьи: подзаголовков тут нет,
      // а форму слова человек заказал видеть.
      shownE+=es.length;
      html+=es.map(e=>entry(e,i,(e.group||'')?имяПодгруппы(S,e.group):'')).join('');
    }
  });
  // ПУСТО ПРИ ПУСТОМ ПОИСКЕ — ЭТО НЕ «СЛОВА НЕТ», А «ЧИТАТЬ НЕЧЕГО».
  //
  // Замечание review-1: если разделы на месте, а статьи лежат под другим
  // именем (`entries` -> `items` — тот же род, что `lessons` -> `sections`
  // 19.10), `render` НЕ падает, а рисует пустоту, и страница говорит «такого
  // слова в словаре нет» о словаре, которого не прочла. Отличить одно от
  // другого можно без всякого знания формы: при ПУСТОМ запросе пустой вывод
  // означает, что статей нет вовсе.
  out.innerHTML=html||('<div class="none">'+esc(f
      ? 'Такого слова в словаре нет.'
      : 'Словарь загружен, но статей в нём не видно — читать нечего. Дело в '+
        'данных, а не в вашем запросе.')+'</div>');
  // УРОКИ — ТОЛЬКО РАЗДЕЛЫ ДОКУМЕНТА: `num` есть и у НАШИХ разделов (у азбуки
  // он «1»), поэтому счёт по одному `num` давал 15 там, где у службы и в
  // карточке 14 (находка review-1 на живой версии dict-20261023-165844.json).
  // Два числа об одном предмете на одной версии — хуже, чем ни одного: человек
  // сверяет страницу с карточкой и решает, что где-то потеря.
  const les=secs.filter(S=>S.num&&!S.by_us).length;
  // «РАЗДЕЛОВ» ЗНАЧИЛО У НАС ДВА РАЗНЫХ ЧИСЛА (замечание test-1 через pm,
  // 23.10): страница писала «разделов: 2», имея в виду НАШИ разделы, а карточка
  // бота — «разделов 16 (наших 2)», имея в виду все. Человек, сверяя два наших
  // же сообщения на одной версии, видел расхождение там, где его нет.
  //
  // Поэтому здесь слово называет предмет целиком: «наших разделов». В поиске
  // «разделов» остаётся общим счётом найденного — там предмет другой, и он
  // назван словом «Найдено».
  // В НАЙДЕННОМ ПРЕДМЕТ ДРУГОЙ — ПОКАЗАННЫЕ СТРОКИ, и назван он словом «строк».
  //
  // Это поймал прогон: на запрос «A1» страница показывала 34 строки, а в
  // подвале писала «статей 3». Причина — мерка словаря: собранные копии в
  // «статей» не идут, и правильно не идут; но В ВЫДАЧЕ они показаны, и число
  // «3» под 34 строками читается как потеря.
  //
  // Поэтому в поиске считаем ровно то, что на экране, и называем это «строк»:
  // одно слово — один предмет. Словарный счёт стоит в подвале без поиска и
  // считается иначе, своей единицей.
  const пометки=пометок_(secs);
  foot.textContent=f?('Найдено: разделов '+shownS+' · строк '+shownE)
                   :('Уроков: '+les+(secs.length>les?' · наших разделов: '+(secs.length-les):'')+
                     ' · статей: '+статей_(secs)+(пометки?(' · строк-пометок: '+пометки):''));
}
// Нажатие на слово или на плашку: снять поиск, показать всё и перейти
// к этому уроку — чтобы видеть его целиком, а не одну найденную строку.
function goto(i){
  // Якорь по НОМЕРУ В СПИСКЕ, а не по номеру урока: у раздела чисел номера нет,
  // и `les'+undefined` увело бы в никуда. Индекс при поиске не меняется — обход
  // идёт по полному списку, отсеиваются только пустые.
  q.value=''; render('');
  const el=document.getElementById('sec'+i);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}
out.addEventListener('click',ev=>{
  // ПЕРЕХОД К ПОДГРУППЕ — ПЕРВЫМ, и он не сбрасывает поиск: человек просил
  // попасть к типу, а не «показать всё». Сам переход делаем руками, чтобы не
  // менять адрес страницы: она открыта из телеграма, и хвост «#grp…» в адресе
  // ему ни к чему.
  const j=ev.target.closest('[data-go]');
  if(j){
    ev.preventDefault();
    const el=document.getElementById(j.getAttribute('data-go'));
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  const t=ev.target.closest('[data-l]');
  if(t) goto(+t.getAttribute('data-l'));
});
// ОТКАЗ НАЗЫВАЕТ ТО, ЧТО ИЗВЕСТНО, И НЕ БОЛЬШЕ (наряд pm 20.10).
//
// Было: любая беда печатала «Не удалось загрузить словарь» — и загрузка, и
// разбор, и отрисовка. Замерено на странице, лежавшей у человека до 19:48:
// данные приходили ЦЕЛЫМИ, падала отрисовка (`data.lessons.forEach` на новой
// форме), а человек читал «не удалось загрузить» и шёл смотреть, не сломали ли
// мы ему словарь. То есть прибор страницы говорил о СЕБЕ, а читалось как
// утверждение о ПРЕДМЕТЕ.
//
// Три исхода различимы, и каждый говорит своё:
//
//	не доехал файл          сеть, 404, не тот тип — про это знаем точно
//	доехал, но без разделов  то же, что отказ бота: «ни одного раздела».
//	                         Молчать нельзя — пустой обход нарисовал бы
//	                         «Такого слова в словаре нет», то есть соврал
//	                         бы о словаре, которого не прочёл
//	доехал, не нарисовался   говорим ровно это и даём ход («обновите»),
//	                         НЕ называя причину: страница не может отличить
//	                         свою старость от беды в данных
//
// Старую страницу в кеше человека это не чинит — она уже у него. Чинит
// следующую: её отказ больше не врёт.
function say(text){ out.innerHTML='<div class="none">'+esc(text)+'</div>'; }
// ЧЕТЫРЕ ИСХОДА, И КАЖДЫЙ ГОВОРИТ ТО, ЧТО ИЗВЕСТНО (наряд pm, возврат review-1).
//
//	не доехал файл      сеть, 404 — знаем точно
//	доехал, не разобран  ФАЙЛ ЕСТЬ. Первая редакция говорила тут «не
//	                     получен», и человек шёл проверять сеть вместо
//	                     данных — та же беда, что заход чинит, только
//	                     причина названа не та (находка review-1). Вход не
//	                     выдуманный: у нас сегодня build.py при полном
//	                     диске записал НУЛЕВОЙ pdf; нулевой dict.json
//	                     появится тем же путём
//	доехал, без разделов как отказ бота: «ни одного раздела»
//	доехал, не нарисован говорим ровно это и даём ход, причину НЕ называем
//
// `r.text()` вместо `r.json()` нарочно: разбор отделён от получения, и в
// сообщение попадает ДЛИНА полученного — «0 байт» само называет беду.
fetch('dict.json?'+Date.now()).then(
  r=>{
    if(!r.ok){ say('Не удалось загрузить словарь: файл dict.json не получен (HTTP '+r.status+').'); return; }
    var lastMod=r.headers&&r.headers.get?r.headers.get('last-modified'):null;
    return r.text().then(t=>{
      var d;
      try{ d=JSON.parse(t); }
      catch(e){
        say('Словарь получен ('+t.length+' байт), но не разобрался: '+e.message+
            '. Дело в самом файле, а не в связи.');
        return;
      }
      if(!d || !Array.isArray(d.sections) || !d.sections.length){
        say('Словарь загружен, но разделов в нём нет. Это не «слова нет» — '+
            'читать нечего, и дело в данных, а не в вашем запросе.');
        return;
      }
      data=d;
      // ВЕРСИЯ НАЗЫВАЕТСЯ ТОЛЬКО ЕСЛИ ОНА ЕСТЬ В ДАННЫХ.
      //
      // Поля `version` в dict.json сегодня нет — служба кладёт его в
      // предложение, а не в данные. Выдумать имя версии по дате загрузки
      // значило бы показать человеку число, которого в файле нет; поэтому
      // здесь «версия в данных не названа», а рядом — то, что ИЗМЕРЕНО:
      // длина полученного и время с заголовка ответа сервера.
      var ver=(d&&d.version)?('версия '+d.version):'версия в данных не названа',
          // Та же мерка, что ниже в подвале: уроки — разделы ДОКУМЕНТА.
          уроков=(d.sections||[]).filter(S=>S.num&&!S.by_us).length,
          // ОДНА МЕРКА ВНУТРИ СТРАНИЦЫ: и подвал, и строка о себе считают
          // статьи одной функцией. Копии нашего раздела в счёт не идут.
          статей=статей_(d.sections||[]),
          пометок=пометок_(d.sections||[]);
      // БАЙТЫ СЧИТАЮТСЯ БАЙТАМИ, А НЕ ЗНАКАМИ, и это моя же пойманная ошибка:
      // первая редакция писала «55 434 байт» для файла в 68 684 байта —
      // `t.length` в браузере это знаки UTF-16, а греческий и кириллица
      // занимают по два байта. Прибор назвал бы человеку число, которое не
      // сходится с размером файла, и он пошёл бы искать беду в данных.
      //
      // Если TextEncoder почему-то недоступен — говорим «знаков», то есть ровно
      // то, что измерено. Единица рядом с числом обязана называть мерку.
      var объём;
      try{ объём=new TextEncoder().encode(t).length+' байт'; }
      catch(e){ объём=t.length+' знаков'; }
      меня.textContent='Загружено: '+ver+' · уроков '+уроков+' · статей '+статей+
        (пометок?(' · строк-пометок '+пометок):'')+
        ' · '+объём+(lastMod?(' · с сервера '+lastMod):'');
      try{ render(''); }
      catch(e){
        say('Словарь загружен, но эта страница его не прочитала. Если она '+
            'давно открыта — обновите её; если не поможет, дело в странице, '+
            'а не в словаре.');
      }
    });
  },
  e=>{ say('Не удалось загрузить словарь: файл dict.json не получен ('+(e&&e.message||e)+').'); }
);
// ТРЕНАЖЁР: греческое слово -> четыре русских перевода. Заказ человека (через
// pm, 05.11), его словами: «греческий — русский, все слова; при выборе ответа
// если верный — подсвечиваем зелёным, если нет — наш ответ красным, а зелёным
// правильный; и возвращаем чаще; транскрипцию после ответа».
//
// УСТРОЙСТВО: чистые функции отдельно от DOM. Вопросы, мера близости и разбор
// ответа ничего не знают о странице — поэтому их мерит прибор (trainer_probe.js)
// без браузера, и предмет проверяется прямо, а не через вид.
//
// Имена латиницей — правило человека (кириллица только в комментариях).
const TRAINER_KEY='greek-dict-trainer-v1';
// СТОП-СЛОВА МЕРЫ БЛИЗОСТИ: служебные слова русского перевода, по которым
// «похожесть» мерить нельзя — они есть почти в каждом переводе.
const TRAINER_STOP=new Set(['и','или','в','во','на','с','со','к','ко','по','за','из',
  'от','до','у','о','об','не','ни','а','но','же','бы','что','как','это','то','та',
  'тот','так','для','при','над','под','про','без','мой','моя','свой','быть','есть']);
// МЕРА БЛИЗОСТИ ПЕРЕВОДОВ — ПО СУЩЕСТВУ, А НЕ ПО СТРОКЕ (условие pm).
//
// Полное совпадение строки не годится: «идти, ехать» и «идти пешком» прошли бы
// как разные, а человек прочёл бы их как один ответ и был бы прав.
//
// Моя мера: переводы БЛИЗКИ, если у них есть общее значимое слово по КОРНЮ.
// Корень беру грубо — первые пять букв нормализованного слова: так «идти» и
// «идти» совпадают, «ехать» и «ездить» нет, но «ходить» и «ходить пешком» —
// да. Служебные слова и слова короче трёх букв в счёт не идут.
//
// Цену меры я померил на живой выгрузке и назвал её в README: столько-то
// вопросов она отбрасывает, потому что трёх НЕблизких чужих вариантов для них
// не находится. Это честнее, чем показать человеку два правильных ответа.
function trainerWords(ru){
  return String(ru||'').toLowerCase()
    .replace(/\([^)]*\)/g,' ')
    .split(/[^a-zа-яё]+/i)
    .filter(w=>w.length>=3&&!TRAINER_STOP.has(w))
    .map(w=>w.slice(0,5));
}
function trainerTooClose(a,b){
  if(!a||!b) return true;
  const na=String(a).trim().toLowerCase(), nb=String(b).trim().toLowerCase();
  if(na===nb) return true;
  const wa=trainerWords(a), wb=new Set(trainerWords(b));
  return wa.some(w=>wb.has(w));
}
// ЧТО ГОДИТСЯ В ВОПРОС (условие pm, и каждое условие куплено входом):
//
//	таблица спряжения   у статьи есть `forms` — это образец, а не слово
//	строка-пометка      head/pair/raw: слова у неё нет вовсе
//	пустое поле         нет `w` или нет `ru` — спрашивать не о чем
//	копия               то же слово второй раз: спросили бы дважды об одном
//	служебный заголовок  `head` ловит его тем же признаком
// ПЕРЕВОД ОБЯЗАН БЫТЬ РУССКИМ. Находка review-1 на #529: в «четыре русских
// перевода» пролезали строки, где русского перевода нет вовсе — буквосочетания
// автора («ει» → «„и": μαγειρεύω — готовить · …») и слова, переведённые
// греческим («ο Τούρκος» → «τουρκικά»). Признак взят у них и перемерен своей
// рукой: кириллица есть И греческих букв ВНЕ скобок нет. Скобки отбрасываются
// тем же приёмом, что в trainerWords, поэтому законное «говорить, разговаривать
// (μιλάω ελληνικά)» остаётся.
function trainerRu(ru){
  const t=String(ru||'');
  if(!/[\u0430-\u044f\u0451\u0410-\u042f\u0401]/.test(t)) return false;
  return !/[\u0370-\u03ff\u1f00-\u1fff]/.test(t.replace(/\([^)]*\)/g,' '));
}
function trainerFit(e){
  if(!e||e.head||e.pair||e.raw) return false;
  // Поле forms несёт ДВА предмета: таблицу спряжения глагола и строку алфавита
  // («Α α άλφα»). Спрашивать переводом нельзя ни то, ни другое: у буквы ответ
  // («альфа · звук «а»») повторяет сам вопрос. Отбрасываем по носителю и
  // называем оба предмета, а не один.
  if((e.forms||[]).length) return false;
  if(e.copy_of) return false;
  if(!trainerRu(e.ru)) return false;
  return !!String(e.w||'').trim()&&!!String(e.ru||'').trim();
}
function trainerPool(data){
  // ОДНО СЛОВО — ОДНА КАРТОЧКА. Автор повторяет слово в поздних уроках, иногда
  // с другим переводом («ο χρόνος»: «время» в 13-м, «время вообще; год» в
  // 14-м). Две карточки на одно слово портят сразу две вещи: слово-повтор
  // выпадает чаще прочих без всякой ошибки, а второй перевод того же слова
  // может встать ЧУЖИМ вариантом к первому — человек узнаёт слово и получает
  // красный за верное знание. Поэтому спрашиваем переводом ПЕРВОГО урока, а
  // остальные переводы носим с собой в also: они запрещены как чужие варианты.
  const out=[], at={};
  ((data&&data.sections)||[]).forEach(S=>{
    (S.entries||[]).forEach(e=>{
      if(!trainerFit(e)) return;
      const w=String(e.w).trim(), ru=String(e.ru).trim();
      if(at[w]!==undefined){
        const c=out[at[w]];
        if(ru!==c.ru&&c.also.indexOf(ru)<0) c.also.push(ru);
        return;
      }
      at[w]=out.length;
      out.push({w:w,ru:ru,also:[],
                tr:String(e.tr||'').trim(),
                lesson:(S.num&&!S.by_us)?S.num:'',
                section:S.title_ru||S.title||''});
    });
  });
  return out;
}
// ВОПРОС: верный ответ и три чужих, НЕблизких ни к верному, ни друг к другу.
// Не набралось трёх — вопроса нет вовсе (возвращаем null): показать человеку
// два правильных ответа хуже, чем не спросить.
function trainerQuestion(pool,card,rnd){
  const r=rnd||Math.random;
  const others=[];
  // Запрещены и ПРОЧИЕ переводы того же слова (also): они верны не меньше
  // спрошенного, и человек, знающий слово, выбрал бы их.
  const seen=[card.ru].concat(card.also||[]);
  const order=pool.map((x,i)=>({x,k:r()*1e9+i})).sort((a,b)=>a.k-b.k).map(o=>o.x);
  for(const cand of order){
    if(cand===card||cand.w===card.w) continue;
    if(seen.some(s=>trainerTooClose(s,cand.ru))) continue;
    seen.push(cand.ru);
    others.push(cand.ru);
    if(others.length===3) break;
  }
  if(others.length<3) return null;
  const options=[card.ru,...others].map((text,i)=>({text,correct:i===0}));
  for(let i=options.length-1;i>0;i--){
    const j=Math.floor(r()*(i+1));
    [options[i],options[j]]=[options[j],options[i]];
  }
  return {w:card.w,tr:card.tr,lesson:card.lesson,answer:card.ru,options};
}
// ОТВЕТ: что подсветить. Верный — зелёным; неверный — НАШ красным И верный
// зелёным (слова человека). Транскрипция приходит только здесь: до ответа её
// не показываем, иначе вопрос отвечает сам на себя.
function trainerJudge(question,picked){
  const right=question.options[picked]&&question.options[picked].correct;
  return {
    right:!!right,
    marks:question.options.map((o,i)=>o.correct?'good':(i===picked?'bad':'')),
    tr:question.tr||'',
  };
}
// ВЕС СЛОВА: ошибочные возвращаются ЧАЩЕ (заказ человека «и возвращаем чаще»).
// Вес — число шансов в выборке: верный ответ уменьшает его до 1, ошибка
// поднимает до 4. Прогресс — в браузере у каждого свой; нам он не виден.
function trainerWeight(stat){
  const s=stat||{};
  const wrong=+s.wrong||0, right=+s.right||0;
  return Math.max(1,Math.min(6,1+wrong*3-Math.min(right,2)));
}
function trainerPick(pool,stats,rnd){
  const r=rnd||Math.random;
  if(!pool.length) return null;
  const bag=[];
  pool.forEach(card=>{
    const n=trainerWeight((stats||{})[card.w]);
    for(let i=0;i<n;i++) bag.push(card);
  });
  return bag[Math.floor(r()*bag.length)]||pool[0];
}
function trainerLoad(){
  try{ return JSON.parse(localStorage.getItem(TRAINER_KEY)||'{}')||{}; }
  catch(e){ return {}; }
}
function trainerSave(stats){
  try{ localStorage.setItem(TRAINER_KEY,JSON.stringify(stats)); }catch(e){}
}
// ШОВ ДЛЯ ПРИБОРА, и он назван: чистые функции выставляются наружу, чтобы
// предмет мерился прямо (сколько статей годно, один ли верный ответ, что
// подсвечено), а не через вид. Страница от этого не меняется.
globalThis.trainer={ru:trainerRu,pool:trainerPool,fit:trainerFit,question:trainerQuestion,
  judge:trainerJudge,tooClose:trainerTooClose,weight:trainerWeight,
  pick:trainerPick,words:trainerWords};

// ВИД ТРЕНАЖЁРА — ТОЖЕ ЧИСТОЙ ФУНКЦИЕЙ: карточка собирается строкой, а DOM
// только вставляет её. Поэтому прибор мерит то, что УВИДИТ человек (есть ли
// транскрипция до ответа, что подсвечено), а не моё описание этого.
function trainerCardHTML(q,judged){
  if(!q) return '<div class="none">Вопросов нет: в словаре не нашлось слов, '
    +'к которым есть три непохожих перевода.</div>';
  const marks=judged?judged.marks:null;
  const opts=q.options.map((o,i)=>{
    const m=marks?(marks[i]||''):'';
    return '<button class="opt'+(m?' '+m:'')+'" data-opt="'+i+'"'
      +(marks?' disabled':'')+'>'+esc(o.text)+'</button>';
  }).join('');
  // ТРАНСКРИПЦИЯ ТОЛЬКО ПОСЛЕ ОТВЕТА (слова человека): до ответа она отвечала
  // бы за него сама.
  const tr=(judged&&q.tr)?('<div class="tr trans">['+esc(q.tr)+']</div>'):'';
  const lesson=q.lesson?('<span class="tr"> · урок '+esc(q.lesson)+'</span>'):'';
  const next=judged?('<button class="next" data-next="1">Дальше</button>'):'';
  return '<div class="card"><div class="ask"><span class="w">'+esc(q.w)+'</span>'
    +lesson+'</div>'+tr+'<div class="opts">'+opts+'</div>'+next+'</div>';
}
function trainerStatsHTML(stats,pool){
  const s=stats||{};
  const слов=pool.length;
  const знакомы=Object.keys(s).filter(k=>(+(s[k]||{}).right||0)>0).length;
  const спотыкаемся=Object.keys(s).filter(k=>(+(s[k]||{}).wrong||0)>0).length;
  // ЧИСЛА ЧЕЛОВЕКУ — СО СВОЕЙ ЕДИНИЦЕЙ, и прогресс лежит только в его браузере:
  // нам он не виден (условие наряда).
  return 'Слов в тренажёре: '+слов+' · отвечали верно: '+знакомы
    +' · спотыкались: '+спотыкаемся+'. Прогресс хранится в этом браузере.';
}
// DOM-слой: вкладки и один обработчик на карточку. Состояние — три поля, и они
// названы: текущая карточка, текущий вопрос, разбор ответа.
let trainerState={card:null,q:null,judged:null,pool:[],stats:{}};
function trainerShow(){
  trainerBox.innerHTML=trainerCardHTML(trainerState.q,trainerState.judged);
  trainerFoot.textContent=trainerStatsHTML(trainerState.stats,trainerState.pool);
}
function trainerNext(){
  trainerState.judged=null;
  trainerState.card=trainerPick(trainerState.pool,trainerState.stats);
  trainerState.q=trainerState.card?trainerQuestion(trainerState.pool,trainerState.card):null;
  trainerShow();
}
function trainerStart(){
  trainerState.pool=trainerPool(data);
  trainerState.stats=trainerLoad();
  trainerNext();
}
function trainerAnswer(i){
  if(!trainerState.q||trainerState.judged) return;
  const j=trainerJudge(trainerState.q,i);
  trainerState.judged=j;
  const key=trainerState.q.w, s=trainerState.stats[key]||{right:0,wrong:0};
  if(j.right) s.right=(+s.right||0)+1; else s.wrong=(+s.wrong||0)+1;
  trainerState.stats[key]=s;
  trainerSave(trainerState.stats);
  trainerShow();
}
function trainerTab(on){
  // Поиск принадлежит словарю: в тренажёре он не нужен и прячется, чтобы его
  // не искали глазами.
  document.getElementById('dict').hidden=on;
  document.getElementById('trainer').hidden=!on;
  q.hidden=on;
  foot.hidden=on;
  tabDict.className=on?'tab':'tab on';
  tabTrainer.className=on?'tab on':'tab';
  if(on&&!trainerState.pool.length) trainerStart();
}
trainerBox.addEventListener('click',ev=>{
  const o=ev.target.closest&&ev.target.closest('[data-opt]');
  if(o){ trainerAnswer(+o.getAttribute('data-opt')); return; }
  const n=ev.target.closest&&ev.target.closest('[data-next]');
  if(n) trainerNext();
});
tabDict.addEventListener('click',()=>trainerTab(false));
tabTrainer.addEventListener('click',()=>trainerTab(true));
globalThis.trainer.cardHTML=trainerCardHTML;
globalThis.trainer.statsHTML=trainerStatsHTML;

q.addEventListener('input',()=>render(q.value));
</script>
</body>
</html>
